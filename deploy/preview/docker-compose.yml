# Environnement PREVIEW (NAS) — auto-hébergé sur NAS Synology (DS720+), exposé par Cloudflare
# Tunnel pour être joignable depuis le téléphone (tests médias/push hors LAN).
#
# Modèle d'environnements du projet (3 tiers) :
#   local (ta machine, sources + hot reload) → preview (ce NAS) → production (à venir)
# Deux axes distincts, à ne pas confondre :
#   - NODE_ENV : MODE d'exécution du runtime. Toute image Docker buildée tourne en `production`
#     (logs JSON, sampling réduit, et surtout pino-pretty — une devDependency — est ABSENTE de
#     l'image ; `development` y ferait crasher le logger au boot). `development` est réservé au
#     tier « local » qui tourne depuis les sources.
#   - APP_ENV : LABEL du tier (preview | production). C'est lui qui distingue les déploiements dans
#     Sentry et dans les logs. Ici `preview`, et il n'a pas de valeur par défaut : voir le service
#     `api`.
#
# ⚠️ Ce tier porte de VRAIES données — les comptes, les planifications et les médias du Coach bêta
# (#260). La règle « données synthétiques uniquement » qui figurait ici ne tient plus depuis qu'il
# accueille de vrais utilisateurs, et c'est elle qui rendait acceptables des tolérances que #257,
# #266, #267, #268 et #263 ont dû fermer une à une. La question HDS est cadrée à part (#259).
#
# Les images api/web sont TIRÉES depuis GHCR : la version promue, que `pull-preview.sh` va chercher
# toutes les 5 minutes et passe ici épinglée par digest (#266). Le NAS ne construit rien, et ce
# compose n'est pas copié à la main : le script le télécharge au commit de la version promue. Les
# autres valeurs viennent d'un `.env` déposé sur le NAS (hors git) — modèle : .env.example.
#
# Réseau : aucun port publié sur l'hôte. Seul cloudflared sort (vers Cloudflare), et il joint
# api/web/silo par nom de service sur le réseau interne. Les trois hostnames publics
# (api-/app-/s3-) sont mappés vers ces services dans le dashboard Cloudflare Zero Trust.

name: cimavia-preview

services:
  postgres:
    image: postgres:18-alpine
    container_name: cimavia_preview_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage S3-compatible, exposé sur `s3-preview` : c'est le téléphone qui appelle les URLs
  # signées. SILO, le fork maintenu de MinIO (#257) — la dernière image MinIO figée acceptait des
  # écritures SANS authentification pour qui connaissait la clé d'accès, lisible dans chaque URL
  # signée. Même API, mêmes variables `MINIO_*`, même format sur disque : le volume se relit tel
  # quel. Tirée du miroir GHCR, épinglée (voir le compose local).
  silo:
    image: ghcr.io/cimavia/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: cimavia_preview_silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Le compte root du stockage, et lui seul : il administre, il ne sert jamais à l'API (#267).
      # `:?` plutôt qu'un repli — sans ces valeurs, le stockage démarrerait avec des identifiants
      # que personne n'a choisis.
      MINIO_ROOT_USER: ${S3_ROOT_USER:?compte root du stockage, voir .env.example}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?mot de passe root du stockage}
    volumes:
      - silo_data:/data

  # Crée le bucket privé et la clé de l'API au premier démarrage, puis s'arrête (idempotent). Même
  # pattern que le compose de dev local : la boucle `until` tient lieu d'attente, l'image SILO n'ayant
  # pas de sonde. C'est le SEUL service qui se connecte en root.
  silo-setup:
    # Même miroir et même version que `silo` ci-dessus.
    image: ghcr.io/cimavia/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: cimavia_preview_silo_setup
    depends_on:
      - silo
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://silo:9000 ${S3_ROOT_USER} ${S3_ROOT_PASSWORD}; do echo 'attente SILO…'; sleep 1; done &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      mc anonymous set none local/${S3_BUCKET} &&
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:PutObject\",\"s3:GetObject\",\"s3:DeleteObject\",\"s3:AbortMultipartUpload\",\"s3:ListMultipartUploadParts\"],\"Resource\":[\"arn:aws:s3:::${S3_BUCKET}/*\"]}]}' > /tmp/api-policy.json &&
      mc admin policy create local cimavia-api /tmp/api-policy.json 2>/dev/null || true &&
      mc admin user add local ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} &&
      mc admin policy attach local cimavia-api --user ${S3_ACCESS_KEY_ID} 2>/dev/null || true &&
      echo 'bucket ${S3_BUCKET} prêt (privé) et clé ${S3_ACCESS_KEY_ID} limitée à ses objets'
      "

  api:
    image: ${API_IMAGE:?posée par pull-preview.sh}
    container_name: cimavia_preview_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # MODE runtime : toujours production pour une image buildée (cf. en-tête). Ne PAS confondre
      # avec le tier ci-dessous.
      NODE_ENV: production
      # LABEL du tier de déploiement (Sentry, logs). SANS REPLI : ce tier porte de vraies données,
      # et un `.env` muet doit empêcher le démarrage plutôt que de les étiqueter « development »
      # dans Sentry — c'est-à-dire de les ranger avec celles qu'on jette.
      APP_ENV: ${APP_ENV:?tier de deploiement attendu dans le .env, ex. preview}
      PORT: "3000"
      # Postgres joint par nom de service sur le réseau interne (jamais exposé à l'extérieur).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # URL PUBLIQUE de l'API (base des liens d'auth signés). Doit matcher le hostname Cloudflare.
      BETTER_AUTH_URL: ${PUBLIC_API_URL}
      # Origine web publique : entre dans CORS + trustedOrigins (cf. browserOrigins). Le scheme
      # mobile cimavia:// est ajouté côté code, pas ici.
      CORS_ORIGINS: ${PUBLIC_WEB_URL}
      # Origines de confiance SUPPLÉMENTAIRES, vide en régime normal. Elle existe pour la
      # transition des hostnames (#271) : un APK déjà installé demande sa réinitialisation de mot
      # de passe avec `redirectTo` vers l'ANCIENNE origine web, que Better Auth compare à cette
      # liste. Sans elle, le lien est refusé et l'écran n'affiche qu'une erreur générique — une
      # redirection 301 n'y change rien, la vérification porte sur la chaîne, pas sur la requête.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      # Qui peut créer un compte (#263). Défaut `invitation` posé ICI, et c'est le point : ce
      # tier est joignable publiquement — son URL est figée dans l'APK et dans chaque e-mail — et
      # il porte de vraies données. Un `.env` qui oublierait la ligne doit laisser la porte
      # FERMÉE, pas l'ouvrir. `SIGNUP_ALLOWED_EMAILS` est la porte des coachs, que personne
      # n'invite — les athlètes, eux, passent par l'invitation de leur coach.
      SIGNUP_MODE: ${SIGNUP_MODE:-invitation}
      SIGNUP_ALLOWED_EMAILS: ${SIGNUP_ALLOWED_EMAILS:-}
      # ⚠️ URL PUBLIQUE du storage, PAS http://silo:9000 : l'API SIGNE les URLs S3 avec cette
      # valeur, et c'est le TÉLÉPHONE qui les appelle (le binaire ne transite jamais par l'API).
      # Un endpoint interne signerait des URLs injoignables depuis le mobile — exactement le piège
      # S3_ENDPOINT documenté au README §WSL2. Conséquence assumée : les rares appels S3 côté
      # serveur (delete, head) ressortent par Cloudflare — surcoût négligeable à ce tier.
      S3_ENDPOINT: ${PUBLIC_S3_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      # Observabilité : actives dès que les secrets sont fournis (sinon no-op, cf. env.schema).
      SENTRY_DSN: ${SENTRY_DSN:-}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Déclencheur des rappels automatiques (#47). À déclarer ICI et pas seulement dans le `.env` :
      # ce fichier n'est lu que pour l'interpolation `${…}`, le conteneur ne reçoit QUE les
      # variables listées dans ce bloc. Absente, la route de tick répond 503 alors que la valeur est
      # pourtant bien dans le `.env` — le symptôme ne désigne pas sa cause.
      REMINDER_TICK_SECRET: ${REMINDER_TICK_SECRET:-}
      # Envoi d'e-mails — un VRAI fournisseur depuis #269 (Scaleway TEM), plus la boîte jetable
      # qu'était Mailpit : le Coach bêta et ses Athletes ne recevaient ni invitation, ni lien de
      # réinitialisation, ni notification.
      # AUCUN repli, et c'est le choix de #269 : une variable oubliée laisse l'envoi ÉTEINT, ce
      # que `MailService` journalise à chaque tentative. Un repli sur une boîte locale rendrait
      # l'oubli invisible — tout aurait l'air parti, et rien ne serait arrivé.
      # ⚠️ À déclarer ICI, comme REMINDER_TICK_SECRET ci-dessus : le conteneur ne reçoit QUE les
      # variables listées dans ce bloc. Absentes, l'envoi reste muet alors que le `.env` les porte.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-Cimavia <no-reply@cimavia.fr>}"
      # Pied des e-mails de notification (#65) : la même URL publique que CORS_ORIGINS ci-dessus,
      # mais nommée — CORS_ORIGINS est une liste, elle ne désigne pas l'app canonique.
      WEB_URL: ${PUBLIC_WEB_URL}

  web:
    image: ${WEB_IMAGE:?posée par pull-preview.sh}
    container_name: cimavia_preview_web
    restart: unless-stopped

  # Sortie vers Cloudflare : établit le tunnel et route les hostnames publics vers les services.
  # Le routage hostname → service est configuré côté dashboard Cloudflare (Zero Trust), pas ici :
  # avec un tunnel par token, cloudflared n'a besoin QUE du token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cimavia_preview_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
      - web
      - silo

volumes:
  # ⚠️ Les deux volumes portent leur nom RÉEL, relevé par `docker volume ls` sur le NAS, et non
  # celui que le projet leur donnerait. Renommer le projet en `cimavia-preview` (#271) les aurait
  # renommés avec lui : PostgreSQL et SILO auraient démarré VIDES, pendant que les données du
  # Coach seraient restées dans les anciens volumes, intactes et invisibles.
  postgres_data:
    name: cimavia-dev_postgres_data
  # Celui-ci porte deux noms d'avant : le projet `cimavia-dev` et le service `minio`, renommé en
  # `silo` en #257. `pull-preview.sh` passe par `up -d --remove-orphans`, qui supprime l'ancien
  # conteneur AVANT de créer le nouveau (mesuré) : deux serveurs n'écrivent jamais ensemble dedans.
  silo_data:
    name: cimavia-dev_minio_data
