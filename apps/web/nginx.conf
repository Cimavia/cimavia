# Configuration nginx du frontend web cimavia (SPA statique).
#
# C'est un TEMPLATE (#417) : copié dans /etc/nginx/templates/, il est réécrit au démarrage du
# conteneur en /etc/nginx/conf.d/default.conf, où il remplace le server block par défaut de l'image.
# Seules les variables `CMV_*` y sont substituées (`NGINX_ENVSUBST_FILTER`, cf. Dockerfile) : les
# variables d'nginx (`$uri`) restent intactes, et aucune autre variable du conteneur ne peut finir
# dans ce que le navigateur reçoit.

# Les documents légaux (#778) sont le seul chemin que Cloudflare Access laisse passer sur
# `app-preview`, et il l'accorde sur le chemin BRUT de la requête. nginx, lui, choisit sa `location`
# sur le chemin NORMALISÉ : `%2F` décodé, `..` résolu. `/legal/..%2Findex.html` passait donc Access
# comme un document légal, puis nginx servait `/index.html` — l'app, ses assets et `/config.js`,
# sans défi (vérifié au curl). La garde lit donc `$request_uri`, le chemin tel qu'Access l'a vu :
# sous `/legal`, seule la forme `/legal/<langue>/<document>` passe, tout le reste répond 404. Même
# forme que `legalPathOf` (`legal-pages.ts`), pour le dev.
#
# Insensible à la casse pour le refus, sensible pour l'accord : `/LEGAL/…` serait un autre chemin
# pour nginx, peut-être pas pour Access. Tout ce qui COMMENCE par `/legal` est refusé, `/legalese`
# compris : rien ne garantit qu'Access arrête son chemin `legal` à une barre — une route de la SPA
# sous ce préfixe y serait publique. Et partout, hors chaîne de requête : une barre ou un point
# encodés, une barre inverse, une double barre, un segment `.` ou `..` — `//legal/..%2F…` ou
# `/./legal/..%2F…` contourneraient sinon le préfixe. Aucune route de l'app n'en porte.
map $request_uri $legal_refused {
    "~^/legal/[a-z]{2}/[a-z-]+(?:\?|$)"           0;
    "~*^/legal"                                   1;
    "~*^[^?]*(?:%2f|%2e|%5c|\\|//|/\.\.?(?:/|$))"  1;
    default                                       0;
}

# Sentry, pour la CSP (#780) : l'hôte d'ingestion que le SDK appelle, et le point d'entrée où le
# navigateur envoie ses rapports de violation. Les deux se LISENT dans le DSN
# (`https://<clé>@<hôte>/<projet>`) plutôt que d'ajouter une variable qui pourrait le contredire.
# Un DSN vide — pas de Sentry — ou d'une autre forme ne donne ni l'un ni l'autre : la politique part
# sans rapport, et le smoke test de l'image (`web-image.yml`) éprouve la forme attendue.
#
# Des captures préfixées `dsn_` : `$host` et `$scheme` sont des variables d'nginx, qu'une capture
# du même nom écraserait pour toute la requête.
map "${CMV_SENTRY_DSN}" $cmv_sentry_origin {
    "~^(?<dsn_scheme>https?)://[^@/]+@(?<dsn_host>[^/]+)/[0-9]+$"  "$dsn_scheme://$dsn_host";
    default                                                         "";
}

map "${CMV_SENTRY_DSN}" $cmv_csp_report_to_sentry {
    "~^(?<dsn_scheme>https?)://(?<dsn_key>[^@/]+)@(?<dsn_host>[^/]+)/(?<dsn_project>[0-9]+)$"  "; report-uri $dsn_scheme://$dsn_host/api/$dsn_project/security/?sentry_key=$dsn_key&sentry_environment=${CMV_APP_ENV}";
    default  "";
}

# Aucun rapport depuis une page dont l'URL porte un secret. Le navigateur envoie ses rapports
# DIRECTEMENT à Sentry, sans passer par le `beforeSend` du SDK (`sentry-scrub.ts`), et chacun porte
# l'URL complète du document : une violation sur `/reset-password?token=…` — une extension suffit —
# y écrirait le jeton en clair, celui que #335 a retiré de tout le reste. La politique s'applique
# toujours, sans rapport. Le document est celui chargé depuis le lien de l'email : une navigation
# interne ne change pas sa politique. Seule route de l'app à porter un secret (cf.
# `redactUrlSecrets`, @cmv/shared).
map $request_uri $cmv_csp_report {
    "~^/reset-password(?:[/?]|$)"  "";
    default                        $cmv_csp_report_to_sentry;
}

server {
    # 8080 : nginx tourne sans root (`nginx-unprivileged`, #83). Le tunnel vise `http://web:8080`.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # ── En-têtes de sécurité (#780) ─────────────────────────────────────────────────────────────
    # Sur CHAQUE réponse : `always` les pose aussi sur un 404 — celui de la garde `/legal`, celui
    # d'un fichier absent —, et `add_header_inherit merge` (nginx ≥ 1.29.3) les fait hériter par
    # les `location` qui posent leur propre `Cache-Control`. Sans lui, un seul `add_header` dans une
    # `location` y effaçait tous ceux du `server`, en silence.
    add_header_inherit merge;

    # Deux politiques, parce que `frame-ancestors` est IGNORÉ en Report-Only : la protection contre
    # l'encadrement (clickjacking) n'existerait pas pendant le cycle d'observation. Celle-ci bloque
    # déjà, et ne contient que ce que l'app ne peut pas utiliser : être encadrée, un plugin, un
    # `<base>` qui redirigerait les chemins relatifs.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;

    # La politique complète, en OBSERVATION le temps d'un cycle de preview : le navigateur signale
    # chaque violation à Sentry sans rien bloquer. Elle passera en bloquant ensuite (#816, P7-11
    # du journal de dette). Ce qu'elle laisse passer, et pourquoi :
    # - `script-src 'self'` : le bundle et `/config.js`. Aucun script inline ni `eval` dans le build,
    #   donc aucun `'unsafe-inline'` — c'est lui qui neutralise un lien `javascript:` (#324) ;
    # - `style-src 'unsafe-inline'` : TipTap injecte une balise `<style>`, les pages légales portent
    #   la leur (`legal-pages.ts`). Les styles seulement ;
    # - `blob:` : l'aperçu local d'un média avant son envoi (`URL.createObjectURL`) ;
    # - `CMV_MEDIA_URL` : l'origine des URLs signées du stockage — lecture des médias, et PUT
    #   d'upload en `connect-src`. L'origine que le NAVIGATEUR appelle : l'endpoint S3 en
    #   path-style (SILO), mais `https://<bucket>.<hôte>` en virtual-hosted (Scaleway) ;
    # - `CMV_API_URL` et l'hôte d'ingestion de Sentry en `connect-src`.
    #
    # Ces valeurs vivent entre guillemets : ni `"` ni `;` ni espace, en plus des `'` et `$` déjà
    # interdits par `/config.js`.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: ${CMV_MEDIA_URL}; media-src 'self' blob: ${CMV_MEDIA_URL}; connect-src 'self' ${CMV_API_URL} ${CMV_MEDIA_URL} $cmv_sentry_origin; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'$cmv_csp_report" always;

    add_header X-Content-Type-Options "nosniff" always;

    # Le défaut des navigateurs actuels, rendu explicite : vers un autre site, l'origine seule — ni
    # le chemin ni la chaîne de requête, où `/reset-password` porte son jeton (#433).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Le micro pour les notes vocales (`useWebAudioRecorder`), à la page elle-même ; le reste fermé.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=(), display-capture=()" always;

    # Compression des assets texte (JS/CSS/JSON/SVG). Les images/polices sont déjà compressées.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fallback SPA : le routeur TanStack est en history « browser » (URLs propres, sans #). Un
    # rechargement sur /athletes ou un lien profond arrive ici comme un vrai chemin — nginx doit
    # renvoyer index.html au lieu d'un 404, et laisser le routeur JS résoudre la route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les documents légaux (#778) : des pages statiques, rendues au build par `legal-pages.ts`, et
    # lisibles SANS compte — les stores l'exigent. C'est le seul chemin que Cloudflare Access laisse
    # passer sur `app-preview` (deploy/preview/README.md).
    #
    # `=404` et surtout pas le repli SPA : une page absente y recevrait index.html, qui chargerait
    # l'app — or ses assets restent derrière Access, et les ouvrir rendrait l'app entière publique,
    # puisque le routeur rejoint ensuite `/login` sans repasser par Cloudflare. `no-cache` : un texte
    # amendé doit se lire au rechargement suivant.
    #
    # `/legal` sans barre finale a sa propre réponse : il tombait sur `location /`, donc sur le repli
    # SPA — or l'exception Access le couvre aussi. La garde ci-dessous le refuse déjà ; la `location`
    # le redit, pour qu'un retrait de la garde ne rouvre pas ce chemin-là.
    if ($legal_refused) {
        return 404;
    }

    location = /legal {
        return 404;
    }

    location ^~ /legal/ {
        try_files $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Assets versionnés par hash de contenu (Vite : /assets/xxx.[hash].js). Le nom change à
    # chaque build, donc on peut les mettre en cache « immutable » très longtemps sans risque de
    # servir une version périmée.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La config du TIER (#417), chargée par index.html avant le bundle : le même bundle part sur
    # chaque tier, seul ce fichier change. Rien de secret : il part chez chaque visiteur.
    #
    # Les trois variables, comme `CMV_MEDIA_URL` qui ne sert que la CSP (plus haut), sont
    # OBLIGATOIRES dans l'environnement du conteneur, même vides : une variable absente n'est pas
    # substituée, nginx lit `${CMV_…}` comme une de ses variables et refuse de démarrer (« unknown
    # "cmv_…" variable »). Définie mais vide, elle part vide, et c'est l'app qui refuse de démarrer
    # (écran de crash) — sauf le DSN, dont le vide veut dire « pas de Sentry », et l'origine des
    # médias, dont le vide ne se verra qu'en Report-Only : le compose du NAS la refuse vide. Aucune
    # valeur ne doit contenir `'` ni `$` : ce serait la fin de la chaîne, ou une variable d'nginx.
    #
    # `location =` exacte, et surtout pas le repli SPA : un `/config.js` absent y recevrait
    # index.html en 200, et le navigateur une erreur de syntaxe au lieu d'un fichier manquant.
    # `no-cache` : un tier reconfiguré doit se voir au rechargement suivant.
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        return 200 'window.__CMV_CONFIG__ = {"apiUrl":"${CMV_API_URL}","sentryDsn":"${CMV_SENTRY_DSN}","tier":"${CMV_APP_ENV}"};\n';
    }

    # index.html N'EST JAMAIS mis en cache : c'est lui qui référence les assets hashés du dernier
    # build. Le cacher ferait pointer un navigateur vers des assets disparus après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
