services:
  postgres-e2e:
    # Épinglée par digest (#379) : Dependabot le réécrit quand `18-alpine` est reconstruite.
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: cimavia_postgres_e2e
    restart: unless-stopped
    environment:
      POSTGRES_USER: cimavia_e2e
      POSTGRES_PASSWORD: cimavia_dev_e2e
      POSTGRES_DB: cimavia_db_e2e
    ports:
      - "5434:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cimavia_e2e -d cimavia_db_e2e"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_e2e_data:
