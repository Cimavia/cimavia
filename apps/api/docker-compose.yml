services:
  postgres:
    image: postgres:18-alpine
    container_name: cimavia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cimavia
      POSTGRES_PASSWORD: cimavia
      POSTGRES_DB: cimavia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cimavia -d cimavia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage S3-compatible pour le dev local (remplace Scaleway sans compte ni CB).
  # Portabilité : seules les variables S3_* changent pour basculer sur Scaleway/Cellar.
  silo:
    # SILO, le fork maintenu de MinIO (#257) : MinIO ne publie plus d'édition communautaire, et la
    # dernière image figée restait visée par deux écritures sans authentification. Même API, mêmes
    # variables `MINIO_*`, même format sur disque — le volume d'avant se relit tel quel.
    #
    # Tirée de NOTRE miroir GHCR, jamais de Docker Hub : l'E2E est un check requis, et un registre
    # tiers en panne ou qui retire ses images le bloquerait (`mirror-images.yml`). Version ÉPINGLÉE ;
    # l'issue `[silo-version]` signale quand une plus récente est copiée.
    image: ghcr.io/cimavia/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: cimavia_silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cimavia
      MINIO_ROOT_PASSWORD: cimavia_dev_secret
    ports:
      - "9000:9000" # API S3 (endpoint)
      - "9001:9001" # Console web (http://localhost:9001)
    volumes:
      - silo_data:/data

  # Crée le bucket privé au démarrage puis s'arrête (idempotent). `mc` est le client de SILO.
  silo-setup:
    # Même miroir et même version que `silo` ci-dessus.
    image: ghcr.io/cimavia/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: cimavia_silo_setup
    depends_on:
      - silo
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://silo:9000 cimavia cimavia_dev_secret; do echo 'attente SILO…'; sleep 1; done &&
      mc mb --ignore-existing local/cimavia-media-dev &&
      mc anonymous set none local/cimavia-media-dev &&
      mc mb --ignore-existing local/cimavia-media-e2e &&
      mc anonymous set none local/cimavia-media-e2e &&
      echo 'buckets cimavia-media-dev et cimavia-media-e2e prêts (privés)'
      "

  # Serveur SMTP jetable pour le dev local : capte TOUT ce que l'API envoie et ne le relaie
  # jamais. Aucun compte cloud, et surtout aucun risque d'écrire à une vraie adresse depuis une
  # base de test — même portabilité que SILO, seules les variables SMTP_* changent en prod.
  mailpit:
    image: axllent/mailpit:latest
    container_name: cimavia_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (SMTP_PORT)
      - "8025:8025" # Boîte de réception web (http://localhost:8025)
    environment:
      # Les messages vivent en mémoire : un `down` vide la boîte, ce qui est le comportement
      # voulu pour un serveur de développement.
      MP_MAX_MESSAGES: "500"

volumes:
  postgres_data:
  # Le service s'appelait `minio` jusqu'en #257 : le volume garde son NOM RÉEL (`api` étant le
  # nom de projet, déduit du dossier). Le renommer ferait démarrer un stockage vide, les médias de
  # dev restant dans l'ancien.
  silo_data:
    name: api_minio_data
