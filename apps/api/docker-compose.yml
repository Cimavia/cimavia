services:
  postgres:
    image: postgres:18-alpine
    container_name: cimavia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cimavia
      POSTGRES_PASSWORD: cimavia
      POSTGRES_DB: cimavia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cimavia -d cimavia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage S3-compatible pour le dev local (remplace Scaleway sans compte ni CB).
  # Portabilité : seules les variables S3_* changent pour basculer sur Scaleway/Cellar.
  minio:
    # quay.io et une version ÉPINGLÉE, plus `minio/minio:latest` : MinIO a retiré ses images de Docker
    # Hub (404 le 2026-09-13, E2E et déploiement NAS cassés d'un coup) et ne publie plus d'édition
    # communautaire depuis septembre 2025. Ce tag est le même digest que l'ancien `latest` de Docker
    # Hub — rien ne change à l'exécution ni pour les données. Figé, donc sans correctif : dette P7-4.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cimavia_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cimavia
      MINIO_ROOT_PASSWORD: cimavia_dev_secret
    ports:
      - "9000:9000" # API S3 (endpoint)
      - "9001:9001" # Console web (http://localhost:9001)
    volumes:
      - minio_data:/data

  # Crée le bucket privé au démarrage puis s'arrête (idempotent).
  minio-setup:
    # Même registre et même raison que `minio` ci-dessus — digest identique à l'ancien `latest`.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: cimavia_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 cimavia cimavia_dev_secret; do echo 'attente MinIO…'; sleep 1; done &&
      mc mb --ignore-existing local/cimavia-media-dev &&
      mc anonymous set none local/cimavia-media-dev &&
      mc mb --ignore-existing local/cimavia-media-e2e &&
      mc anonymous set none local/cimavia-media-e2e &&
      echo 'buckets cimavia-media-dev et cimavia-media-e2e prêts (privés)'
      "

  # Serveur SMTP jetable pour le dev local : capte TOUT ce que l'API envoie et ne le relaie
  # jamais. Aucun compte cloud, et surtout aucun risque d'écrire à une vraie adresse depuis une
  # base de test — même portabilité que MinIO, seules les variables SMTP_* changent en prod.
  mailpit:
    image: axllent/mailpit:latest
    container_name: cimavia_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (SMTP_PORT)
      - "8025:8025" # Boîte de réception web (http://localhost:8025)
    environment:
      # Les messages vivent en mémoire : un `down` vide la boîte, ce qui est le comportement
      # voulu pour un serveur de développement.
      MP_MAX_MESSAGES: "500"

volumes:
  postgres_data:
  minio_data:
