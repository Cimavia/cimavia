name: CI

on:
  push:
    branches: [main, staging, production]
  pull_request:
    branches: [main, staging, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.34.4"
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    env:
      # DSN factice : `prisma generate` lit prisma.config.ts, dont le env() exige la variable — il
      # ne se connecte à aucune base. Volontairement SANS identifiants : un mot de passe ici, même
      # inventé, est un secret en clair pour tout scanner (et pour quiconque le recopie).
      DATABASE_URL: postgresql://localhost:5432/placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # `--ignore-scripts` : aucune dépendance ne doit pouvoir exécuter de code à l'installation.
      # Le seul script dont on a besoin est le nôtre (`postinstall: prisma generate`), qu'on relance
      # donc explicitement — le comportement est identique, l'exécution arbitraire ne l'est plus.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm --filter @cmv/api exec prisma generate

      - name: Biome CI
        run: pnpm biome ci .

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test

      # Les clés i18n assemblées (`t(`a.b.${x}`)`) échappent au typecheck : sans cette étape, une
      # clé renommée s'affiche en clair dans l'UI sans qu'aucune porte de qualité ne bronche.
      # Sans `--strict` : une clé morte est un signal, pas un blocage de PR.
      - name: Check i18n keys
        run: pnpm check:i18n

  # Job séparé, et non une étape de `quality` : les deux tournent en parallèle (le retour de PR
  # reste borné par le plus long des deux), les logs ne se mélangent pas, et un service Docker qui
  # ne monte pas ne masque pas le résultat du lint.
  #
  # Sur CHAQUE PR, pas seulement sur main : une porte qui ne se ferme qu'après le merge ne bloque
  # rien. C'est précisément la panne qu'on répare — les e2e n'étaient exécutés nulle part, et deux
  # d'entre eux sont restés cassés plusieurs jours derrière une CI verte (#36).
  e2e:
    name: E2E (isolation multi-tenant)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # DATABASE_URL est posé sur CETTE étape et pas sur le job : `loadEnvFile` ne surcharge pas une
      # variable déjà présente, donc un DATABASE_URL de job masquerait celui de `.env.test` et la
      # suite viserait la mauvaise base. Le garde-fou de `global-setup.e2e.ts` l'arrêterait, mais on
      # préfère que le cas ne puisse pas se produire. Placeholder sans identifiants (cf. `quality`).
      - name: Generate Prisma client
        run: pnpm --filter @cmv/api exec prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/placeholder

      # Le modèle est copié tel quel : la CI ne redéfinit aucune valeur, donc l'env des e2e ne peut
      # pas diverger entre une machine et le runner — et aucun identifiant n'entre dans ce workflow.
      - name: Bootstrap l'env e2e
        run: cp apps/api/.env.test.example apps/api/.env.test

      # Les MÊMES composes qu'en local, plutôt que des `services:` : ceux-ci obligeraient à réécrire
      # en YAML la création du bucket, et deux copies de la même chose finissent par diverger.
      # `--wait` s'appuie sur le healthcheck `pg_isready` déjà déclaré dans le compose.
      - name: Démarre la base e2e jetable (5434)
        run: docker compose -f apps/api/docker-compose.test.yml up -d --wait

      # Un conteneur de service GitHub n'exécuterait PAS cet entrypoint : le bucket n'existerait
      # pas, et le flux médias de P4 (URL signée → PUT direct → rattachement → purge) échouerait —
      # c'est la moitié de ce que ces e2e protègent. `run --rm` démarre MinIO, joue l'entrypoint
      # idempotent et propage son code de sortie : c'est la barrière de disponibilité, pas un sleep.
      # Seul `minio` démarre ici, pas le Postgres de dev du même compose (5432).
      - name: Démarre MinIO et crée le bucket e2e
        run: docker compose -f apps/api/docker-compose.yml run --rm minio-setup

      # Via Turbo pour la dépendance `^build` : les e2e bootent le vrai AppModule, qui importe
      # @cmv/shared depuis son `dist` — absent après une installation `--ignore-scripts`.
      - name: E2E
        run: pnpm turbo test:e2e --filter=@cmv/api

      - name: Logs des services (si échec)
        if: failure()
        run: |
          docker compose -f apps/api/docker-compose.test.yml logs --tail=50
          docker compose -f apps/api/docker-compose.yml logs --tail=50
