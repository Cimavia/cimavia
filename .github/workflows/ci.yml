name: CI

# Sur les PR vers `main`, et sur `main` au seul commit de release. Jamais sur `preview` ni
# `production` : elles n'avancent plus par PR mais par promotion d'une version (#266), qui vérifie
# que CE commit a déjà passé les checks ici. Les relancer sur la branche de promotion rejouerait les
# mêmes tests sur le même commit.
on:
  # Le push sur `main` ne tourne QUE pour le commit de release (#318). Le merge d'une feature n'a
  # rien à prouver : le ruleset `Main` exige une PR à jour de `main`, donc l'arbre testé par son run
  # `pull_request` est exactement celui qui atterrit. Le rejouer coûtait deux choses :
  #   - le gardien Sonar : la période de code neuf est `previous_version`, dont la référence est la
  #     dernière analyse sous le numéro précédent. Analysé sous l'ancien numéro, chaque merge de
  #     feature devenait cette référence, et l'analyse de la release ne comparait plus que les
  #     quatre fichiers du bump ;
  #   - la promotion : un merge arrivant juste après la release annulait le run de son commit, qui
  #     n'avait alors plus de checks verts — la version devenait impossible à promouvoir.
  # Le run de release reste indispensable : `promote-preview.yml` lit les checks sur le sha du
  # commit de `main`, pas sur celui de la PR. Le couper ferait échouer toute promotion sur
  # « absent ».
  #
  # Le manifest et non `package.json` : seul `release-please` l'écrit, et rien n'arrive sur `main`
  # sans PR (ruleset sans contournement). Une feature qui touche le `package.json` racine (un
  # script, une devDep) redeviendrait sinon la référence Sonar de la release suivante.
  push:
    branches: [main]
    paths: [.release-please-manifest.json]
  pull_request:
    branches: [main]

# Une PR relancée annule son run précédent : seul son dernier état compte. Un run de `main`, lui,
# n'est JAMAIS annulé — c'est le seul que la promotion sait lire. Le filtre ci-dessus devrait
# suffire à ce que deux runs de `main` ne se chevauchent plus ; cette ligne le garantit même si le
# filtre change un jour.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Tout ce qui ne lance pas Vitest : messages de commit, Biome, journaux, migrations, types, clés
  # i18n. Séparé des tests depuis #683 : un rouge de lint n'attend plus la fin de la suite web pour
  # se voir. Le check requis reste `quality`, plus bas, qui rend le verdict de ce job et des tests.
  lint:
    name: Lint + Typecheck
    # Ubuntu épinglé, pas `ubuntu-latest` (#413) : le passage à une nouvelle version se fait
    # dans une PR que la CI teste, pas un jour choisi par GitHub. Même runner pour tous les jobs
    # du dépôt.
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le jeton n'est pas laissé dans `.git/config` : aucune étape ne pousse, et un artefact
          # ou une action tierce qui lirait le dépôt n'y trouverait rien.
          persist-credentials: false
          fetch-depth: 0

      # pnpm, Node, dépendances et client Prisma : la même mise en place pour tous les jobs.
      - name: Setup
        uses: $/.github/actions/setup

      # Le hook `commit-msg` ne voit que le poste : un commit fait dans l'interface GitHub, par une
      # suggestion de revue ou avec `--no-verify` arrivait sur `main` sans contrôle — et
      # `release-please` ignore en silence ce qu'il ne sait pas lire, sans bump ni CHANGELOG (#416).
      # Une étape et non un job : elle hérite, par `quality`, de son statut requis, là où un nouveau
      # job requis serait un check de plus à déclarer dans le ruleset.
      # La base de la PR et non `origin/main` : une PR en retard relirait sinon des commits qui ne
      # sont pas les siens. Les commits de merge sont ignorés par commitlint. Les deux sha passent
      # par `env:`, jamais interpolés dans le script (#401). `fetch-depth: 0` les rend présents.
      - name: Commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Biome CI
        run: pnpm biome ci .

      # Une règle GritQL qui ne trouve plus rien ne fait pas échouer `biome ci` : elle se tait. Ce
      # banc la passe sur des fixtures où chaque ligne à signaler est marquée (#623).
      - name: Check Biome rules
        run: pnpm check:lint-rules

      # Le journal de dette n'a plus de liste « sans issue » tenue à la main : elle dérivait sans que
      # rien ne casse. Ce script la calcule, et refuse un identifiant en double ou une dette ouverte
      # sans suivi (#624). Avant typecheck : une lecture de fichiers, qui répond aussitôt.
      - name: Check journal de dette
        run: pnpm check:dette

      # Une migration qui supprime une colonne passait la CI sans signal, et preview la joue au
      # démarrage, sur les données réelles du Coach bêta (#628). squawk relit les seuls
      # `migration.sql` que la PR apporte ; une opération voulue se déclare dans le fichier, avec sa
      # raison. Une étape de ce job, comme commitlint : elle hérite du statut requis de `quality`.
      # Sur les PR seulement — le run de release n'apporte aucune migration qui n'ait déjà été relue.
      - name: Migrations (squawk)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm check:migrations --base "$BASE_SHA"

      - name: Typecheck
        run: pnpm turbo typecheck

      # Les clés i18n assemblées (`t(`a.b.${x}`)`) échappent au typecheck : sans cette étape, une
      # clé renommée s'affiche en clair dans l'UI sans qu'aucune porte de qualité ne bronche.
      # Sans `--strict` : une clé morte est un signal, pas un blocage de PR.
      - name: Check i18n keys
        run: pnpm check:i18n

  # Les tests unitaires, en trois jobs parallèles (#683). Sous un seul `turbo test`, les quatre
  # suites Vitest se disputaient les 4 vCPU du runner, chacune avec ses propres workers : l'étape
  # prenait 300 à 355 s, quand `SessionBuilderScreen.test.tsx`, le plus lent des fichiers, tient en
  # 13 s seul sur un poste. Le web et le mobile, les deux plus lourds, ont chacun leur runner ; le
  # reste partage le troisième.
  #
  # Par `turbo` et non `pnpm --filter … test` : la dépendance `^build` construit le `dist` de
  # @cmv/shared, absent après une installation `--ignore-scripts`.
  #
  # Ces lcov sont ceux que le job Sonar analyse : il ne rejoue plus les tests (#318). Deux
  # exécutions de la même suite, sur deux runners, pouvaient diverger sur un flake — et c'était
  # la seconde, invisible dans les logs de ce job, qui décidait de la porte.
  # `if-no-files-found: error` : un lcov manquant ne se lit pas « 0 % » chez Sonar, il ne se
  # lit pas du tout, et la Quality Gate échouerait sur `new_coverage` sans dire pourquoi.
  test-web:
    name: Tests web
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Test
        run: pnpm turbo test --filter=@cmv/web

      # Un seul chemin : l'artefact ne garde que `lcov.info`, sans son dossier. Le job Sonar le
      # replace donc lui-même sous `apps/web/coverage/`.
      - name: Upload de la couverture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: apps/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  test-mobile:
    name: Tests mobile
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Test
        run: pnpm turbo test --filter=@cmv/mobile

      # Un seul chemin, comme pour le web : le job Sonar replace le fichier sous `apps/mobile/coverage/`.
      - name: Upload de la couverture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-mobile
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  # Tout ce qui n'est ni le web ni le mobile : @cmv/shared, les tests unitaires de l'API, @cmv/e2e.
  # Le filtre exclut plutôt qu'il ne liste : un nouveau paquet testé tourne ici d'office, sans
  # qu'on pense à l'ajouter. Son lcov, lui, reste à déclarer : dans l'upload ci-dessous, dans le
  # job Sonar et dans `sonar-project.properties`.
  test-autres:
    name: Tests hors web et mobile
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Test
        run: pnpm turbo test --filter='!@cmv/web' --filter='!@cmv/mobile'

      # Deux chemins, dont l'ancêtre commun est la racine : l'artefact garde leur arborescence, et
      # le job Sonar les retrouve là où `sonar-project.properties` les attend.
      - name: Upload de la couverture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-autres
          path: |
            packages/shared/coverage/lcov.info
            apps/api/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  # Le check requis, sous son nom d'avant #683 : le ruleset `Main` et `promote-preview.yml` le
  # lisent tel quel, et rien n'y change. Il ne fait rien d'autre que rendre le verdict des quatre
  # jobs ci-dessus.
  #
  # `!cancelled()` et non le défaut (`success()`) : sans lui, l'échec d'un job de test SAUTERAIT
  # celui-ci — et un check requis sauté compte comme réussi pour GitHub. D'où la lecture explicite
  # de `needs.*.result`, où « skipped » n'est pas « success ». Il tourne aussi au run de release :
  # la promotion lit ce contexte sur le sha de `main`, et le trouverait sinon « absent ».
  quality:
    name: Lint + Typecheck + Test
    if: ${{ !cancelled() }}
    needs: [lint, test-web, test-mobile, test-autres]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Ni checkout ni jeton : il ne lit que le résultat des autres jobs.
    permissions: {}

    steps:
      # Par `env:`, jamais interpolé dans le script (#401).
      - name: Verdict des jobs de lint et de tests
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key) : \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "::error::Un job de lint ou de tests n'a pas réussi : voir la liste ci-dessus."
            exit 1
          fi

  # Job séparé, et non une étape des jobs ci-dessus : tous tournent en parallèle (le retour de PR
  # reste borné par le plus long), les logs ne se mélangent pas, et un service Docker qui ne monte
  # pas ne masque pas le résultat du lint.
  #
  # Sur CHAQUE PR, pas seulement sur main : une porte qui ne se ferme qu'après le merge ne bloque
  # rien. C'est précisément la panne qu'on répare — les e2e n'étaient exécutés nulle part, et deux
  # d'entre eux sont restés cassés plusieurs jours derrière une CI verte (#36).
  e2e:
    name: E2E (isolation multi-tenant)
    runs-on: ubuntu-26.04
    timeout-minutes: 10 # 1 min 43 au plus observé, images comprises

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      # Le modèle est copié tel quel : la CI ne redéfinit aucune valeur, donc l'env des e2e ne peut
      # pas diverger entre une machine et le runner — et aucun identifiant n'entre dans ce workflow.
      - name: Bootstrap l'env e2e
        run: cp apps/api/.env.test.example apps/api/.env.test

      # Les MÊMES composes qu'en local, plutôt que des `services:` : ceux-ci obligeraient à réécrire
      # en YAML la création du bucket, et deux copies de la même chose finissent par diverger.
      # `--wait` s'appuie sur le healthcheck `pg_isready` déjà déclaré dans le compose.
      - name: Démarre la base e2e jetable (5434)
        run: docker compose -f apps/api/docker-compose.test.yml up -d --wait

      # Un conteneur de service GitHub n'exécuterait PAS cet entrypoint : le bucket n'existerait
      # pas, et le flux médias de P4 (URL signée → PUT direct → rattachement → purge) échouerait —
      # c'est la moitié de ce que ces e2e protègent. `run --rm` démarre SILO, joue l'entrypoint
      # idempotent et propage son code de sortie : c'est la barrière de disponibilité, pas un sleep.
      # Seul `silo` démarre ici, pas le Postgres de dev du même compose (5432). Les deux images viennent
      # du miroir GHCR public : aucune connexion à un registre, aucune dépendance à Docker Hub (#257).
      - name: Démarre SILO et crée le bucket e2e
        run: docker compose -f apps/api/docker-compose.yml run --rm silo-setup

      # Via Turbo pour la dépendance `^build` : les e2e bootent le vrai AppModule, qui importe
      # @cmv/shared depuis son `dist` — absent après une installation `--ignore-scripts`.
      - name: E2E
        run: pnpm turbo test:e2e --filter=@cmv/api

      # Ce lcov est la SEULE mesure de couverture de l'API (les tests unitaires y sont à 3,5 %).
      # Il transite par un artefact plutôt que par une seconde exécution de la suite dans le job
      # Sonar : la relancer donnerait deux brassages de base par PR, deux occasions de flaker, et
      # une couverture mesurée sur une autre exécution que celle qui garde la porte.
      - name: Upload de la couverture e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-e2e
          path: apps/api/coverage-e2e/lcov.info
          retention-days: 1

      - name: Logs des services (si échec)
        if: failure()
        run: |
          docker compose -f apps/api/docker-compose.test.yml logs --tail=50
          docker compose -f apps/api/docker-compose.yml logs --tail=50

  # Les parcours du Coach dans un navigateur, contre une vraie API (#627). Ni les tests de rendu du
  # web (API simulée) ni les e2e de l'API (sans navigateur) ne voient ce qui les relie : routage,
  # cookie de session, cache TanStack Query, rendu réel.
  #
  # PAS un check requis, pour l'instant : un navigateur flake plus qu'une API, et sa stabilité se
  # juge avant de lui confier une porte. Le rouge se voit sur la PR, il ne bloque pas le merge.
  #
  # Filtré par ÉTAPES, comme « Builds de production » : le job conclut toujours, et pourra devenir
  # requis sans qu'une PR de documentation reste en attente d'un statut.
  e2e-web:
    name: E2E web (parcours Coach)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Le web et ce qu'il consomme, plus l'API : un parcours casse aussi bien sur une route qui
      # change que sur un écran.
      - name: Ce que la PR touche
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          common='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|turbo\.json|\.nvmrc|\.github/workflows/ci\.yml|\.github/actions/)'
          if grep -qE -e "$common" -e '^(apps/(web|api)/|packages/(shared|tokens|tsconfig|e2e)/)' <<<"$files"; then
            echo "web=true"
          else
            echo "web=false"
          fi | tee -a "$GITHUB_OUTPUT"

      - name: Setup
        if: steps.changes.outputs.web == 'true'
        uses: $/.github/actions/setup

      # La base seule : aucun parcours ne touche aux médias, et l'API démarre sans storage.
      # `e2e/prepare-database.mjs` y crée sa propre base, `cimavia_db_web_e2e`, avant que l'API démarre.
      - name: Démarre la base e2e jetable (5434)
        if: steps.changes.outputs.web == 'true'
        run: docker compose -f apps/api/docker-compose.test.yml up -d --wait

      # Le navigateur suit la version de Playwright : la clé de cache la lit dans le paquet installé,
      # pas dans une seconde valeur à tenir à la main.
      - name: Version de Playwright
        if: steps.changes.outputs.web == 'true'
        id: playwright
        run: echo "version=$(pnpm --filter @cmv/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache du navigateur
        if: steps.changes.outputs.web == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}-${{ runner.os }}

      # `--with-deps` à chaque fois : le cache garde le navigateur, pas les bibliothèques système
      # qu'il réclame. Le téléchargement, lui, est sauté quand le cache a répondu.
      - name: Installe Chromium
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @cmv/web exec playwright install --with-deps chromium

      # La config lance elle-même l'API et le web de test (`webServer`), sur leurs ports à eux.
      - name: E2E web
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @cmv/web test:e2e:web

      # Les traces des échecs : le DOM, le réseau et chaque étape, rejouables par
      # `pnpm exec playwright show-trace`. Leurs données n'existent que le temps de la suite.
      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Logs de la base (si échec)
        if: failure()
        run: docker compose -f apps/api/docker-compose.test.yml logs --tail=50

  # Le build de PRODUCTION des trois apps, avant le merge (#414). Le typecheck ne voit pas ce qu'un
  # build voit : un fichier exclu par `.dockerignore`, une dépendance que `pnpm deploy --prod`
  # retire, un `turbo prune` qui ne suit plus le graphe, un import que Rollup ou Metro ne résout
  # pas. Sans ce job, la casse se découvrait après le merge pour l'API, à la promotion pour le web,
  # et jamais pour le mobile avant un build EAS.
  #
  # Sur les PR seulement : le run de release de `main` n'a rien à reconstruire, `api-image.yml`
  # construit déjà ce commit. Aucun secret, et aucun n'est nécessaire — une PR de fork n'en reçoit
  # pas.
  #
  # Le filtre par chemins est porté par les ÉTAPES, pas par `on.pull_request.paths` ni par un `if:`
  # de job : le job tourne toujours et conclut toujours, ce qui permet d'en faire un check requis
  # sans qu'une PR de documentation reste bloquée sur « Waiting for status to be reported ».
  builds:
    name: Builds de production
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15 # 3 min 54 observé, les trois apps à froid

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historique complet : la détection compare la PR à sa base commune avec `main`.
          fetch-depth: 0

      # Trois points (`BASE...HEAD`) : depuis l'ancêtre commun, donc seulement ce que la PR
      # apporte, même si `main` a avancé depuis. Chaque app suit ses propres sources et les paquets
      # qu'elle consomme ; ce qui touche les trois (lockfile, workspace, Node, contexte Docker, ce
      # job lui-même) les reconstruit toutes.
      - name: Ce que la PR touche
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          common='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|turbo\.json|\.nvmrc|\.dockerignore|\.github/workflows/ci\.yml|\.github/actions/)'
          flag() {
            if grep -qE -e "$common" -e "$2" <<<"$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi
          }
          {
            flag api '^(apps/api/|packages/(shared|tsconfig)/)'
            # `e2e` : le `tsc` du build web vérifie `e2e/`, qui importe @cmv/e2e (#630).
            flag web '^(apps/web/|packages/(shared|tokens|tsconfig|e2e)/)'
            flag mobile '^(apps/mobile/|packages/(shared|tokens|tsconfig)/)'
          } | tee -a "$GITHUB_OUTPUT"

      - name: Setup Buildx
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.web == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Le cache de `main` est LU, jamais écrit (`cache-to` absent) : une PR ne doit pas pouvoir
      # empoisonner les couches que `api-image.yml` et `web-image.yml` réutilisent. Chaque image lit
      # son scope. `cacheonly` : rien n'est chargé ni poussé, seul le succès du build compte.
      - name: Build de l'image API
        if: steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=api

      # Sans build-args : les défauts du Dockerfile suffisent à prouver que le bundle se construit.
      # Sans jeton Sentry, les sourcemaps ne partent simplement pas. La config du tier n'est plus un
      # argument de build (#417) : elle est lue au démarrage, ce que ce job ne fait pas —
      # `web-image.yml` la démarre après le merge, sur `main`.
      - name: Build de l'image web
        if: steps.changes.outputs.web == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=web

      - name: Setup
        if: steps.changes.outputs.mobile == 'true'
        uses: $/.github/actions/setup

      # Depuis `apps/mobile` : lancée à la racine, la commande échoue sans raison lisible (la config
      # Expo n'y est pas). Sans `APP_VARIANT`, `app.config.ts` retombe sur `development` et n'exige
      # aucune URL : le bundle Hermes se construit sans secret.
      - name: Export Expo (android)
        if: steps.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: pnpm exec expo export --platform android

  # Rapatrié depuis `sonar.yml` en #57 : SonarCloud veut TOUS les lcov dans UN scan, or ils naissent
  # dans plusieurs jobs ci-dessus — l'unitaire dans les trois jobs de tests, celui de l'API dans
  # `e2e`. Un artefact ne traverse pas deux workflows sans une course entre deux runs déclenchés par
  # le même événement — les mettre dans le même run rend l'ordre déterministe.
  #
  # Il n'exécute aucun test (#318) : il analyse ce que les autres ont mesuré, et démarre après le
  # plus long d'entre eux. Il n'attend ni `lint` ni `quality` : le lint ne produit aucune mesure.
  # Si un job de tests échoue, ce job est sauté, et un check requis sauté passe pour GitHub : c'est
  # `quality`, l'agrégateur, qui bloque alors la PR.
  #
  # Le nom du job est inchangé à dessein : les rulesets exigent le contexte « SonarCloud Analysis »,
  # qui est le nom du JOB et non celui du workflow (cf. « Appris en #130 »,
  # docs/dette/qualite-et-depot.md).
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15 # 2 min 24 observé, plus jusqu'à 5 min d'attente de la Quality Gate
    needs: [test-web, test-mobile, test-autres, e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historique complet : Sonar attribue le code neuf par `git blame`.
          fetch-depth: 0

      - name: Setup
        uses: $/.github/actions/setup

      # Le `dist` de @cmv/shared, que `turbo test` construit en dépendance (`^build`) sur SON runner :
      # l'API le résout par son `package.json`. Sans lui, l'analyse de types de Sonar ne tournerait
      # plus dans le même environnement que le typecheck, et ses résultats pourraient changer.
      # @cmv/tokens n'a pas d'étape de build : rien à construire de ce côté.
      - name: Build @cmv/shared
        run: pnpm turbo build --filter=@cmv/shared

      # La couverture doit exister AVANT le scan : sans lcov, Sonar ne lit pas « 0 % », il ne lit
      # rien — et la Quality Gate échoue sur `new_coverage` quoi qu'on écrive. Un téléchargement par
      # artefact, chacun replacé là où `sonar-project.properties` l'attend, plutôt qu'un seul par
      # `pattern: coverage-*` : celui-ci range chaque artefact sous un dossier à son nom, et les
      # lcov du web et du mobile, envoyés seuls, n'ont même plus leur dossier d'origine.
      # Celle-ci couvre @cmv/shared et les tests unitaires de l'API, à leur place dans l'arbre…
      - name: Récupère la couverture api + shared
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-autres

      - name: Récupère la couverture web
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-web
          path: apps/web/coverage

      - name: Récupère la couverture mobile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-mobile
          path: apps/mobile/coverage

      # …et celle-ci, produite par le job e2e, apporte les ~86 % de l'API. Sonar unit les rapports
      # par fichier, il n'y a donc pas de fusion à faire à la main.
      - name: Récupère la couverture e2e
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-e2e
          path: apps/api/coverage-e2e

      # `qualitygate.wait` : SANS lui, le scanner publie puis sort en 0 quoi que dise la porte. Ce
      # job était donc vert sur des analyses dont la Quality Gate échouait — un check requis qui ne
      # vérifiait que « le scan a bien été envoyé ». Avec l'option, le scanner attend le verdict et
      # propage l'échec, ce qui est la seule façon dont une porte garde quelque chose.
      #
      # ⚠️ Rend la gate BLOQUANTE pour toutes les PR. À ne fusionner qu'une fois la gate au vert,
      # sinon c'est le dépôt entier qui se ferme. La définition du « code neuf » compte autant que
      # le seuil : une période mal réglée fait échouer des PR irréprochables.
      # Lue à la source. `sonar-project.properties` serait le mauvais endroit : le numéro y
      # deviendrait une seconde valeur à tenir à la main, périmée dès le premier bump.
      - name: Version analysée
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          # 300 s par défaut. La gate se calcule en quelques secondes ; ce délai n'existe que pour
          # qu'une lenteur de SonarCloud ne bloque pas le runner indéfiniment.
          # `projectVersion` : sans lui, chaque analyse était enregistrée « not provided » — et un
          # événement VERSION de ce nom a fini par polluer la frise du projet. C'est aussi ce qui
          # rend possible le mode « previous version » du code neuf (dette Q-5).
          # `buildString` identifie le build SANS créer d'événement de version, là où le sha en
          # `projectVersion` en poserait un par commit.
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.buildString=${{ github.sha }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
