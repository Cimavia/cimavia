name: Deploy — dev (NAS)

# Tier « development » du modèle local → dev(NAS) → staging → prod : un push sur `main` publie les
# images sur GHCR. Le déploiement sur le NAS (pull + up sur le runner self-hosted) est ajouté
# dans un job séparé au commit suivant. staging/production auront leurs propres workflows.
#
# NB : la porte qualité (lint/typecheck/test) tourne en parallèle via ci.yml. Le build d'image
# échoue de toute façon sur une erreur de type (nest build = tsc) ; un test rouge, lui, ne bloque
# pas la publication à ce tier — c'est assumé pour garder la boucle dev rapide. On resserrera pour
# staging/prod.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "deploy/dev/**"
      - ".github/workflows/deploy-dev.yml"

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

# Aucun droit par défaut : chaque job déclare les siens (moindre privilège). Seul le job qui publie
# a besoin d'écrire sur GHCR ; celui qui déploie n'a qu'à lire.
permissions: {}

jobs:
  build-and-push:
    name: Build & push ${{ matrix.image }} → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cimavia-api
            dockerfile: apps/api/Dockerfile
          - image: cimavia-web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GHCR exige un namespace en minuscules ; le propriétaire du dépôt peut contenir des
      # majuscules. On le normalise une fois ici.
      - name: Namespace GHCR (minuscules)
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Le web fige VITE_API_URL dans le bundle AU BUILD : il faut l'URL publique de l'API du tier
      # dev. Absente, on échoue tôt plutôt que de publier une image web pointant sur localhost.
      - name: Vérifier DEV_PUBLIC_API_URL (web uniquement)
        if: matrix.image == 'cimavia-web'
        run: |
          if [ -z "${{ vars.DEV_PUBLIC_API_URL }}" ]; then
            echo "::error::Variable de dépôt DEV_PUBLIC_API_URL vide — l'image web pointerait sur localhost."
            exit 1
          fi

      # Le DSN, lui, n'est PAS vérifié : vide, le SDK reste inerte et l'app marche — contrairement à
      # une URL d'API vide, qui livrerait un SPA cassé. Ce qui est vérifié ici est la COHÉRENCE du
      # téléversement des sourcemaps : dès qu'un jeton existe, `vite.config.ts` exige aussi l'org et
      # le projet. Sans ce garde-fou, l'oubli d'une variable ferait échouer le build d'image sur un
      # message enfoui dans les logs de Docker.
      - name: Vérifier la cohérence Sentry (web uniquement)
        if: matrix.image == 'cimavia-web'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::Aucun SENTRY_AUTH_TOKEN — les sourcemaps ne seront pas publiées."
            exit 0
          fi
          if [ -z "${{ vars.SENTRY_ORG }}" ] || [ -z "${{ vars.SENTRY_PROJECT_WEB }}" ]; then
            echo "::error::SENTRY_AUTH_TOKEN est défini mais SENTRY_ORG ou SENTRY_PROJECT_WEB manque."
            exit 1
          fi

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag mobile `dev` (celui que référence deploy/dev/docker-compose.yml) + tag immuable par SHA
      # (traçabilité / rollback).
      - name: Métadonnées (tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=dev
            type=sha

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Le NAS (DS720+) est en x86_64 : build natif amd64, pas d'émulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # build-args uniquement pour le web. Forme multi-ligne et non le ternaire d'une seule
          # valeur d'avant : `format()` ne tient pas six arguments lisiblement, et la liste vide
          # est ce que reçoit l'API.
          #
          # VITE_APP_ENV est un LITTÉRAL et non une variable de dépôt de plus : le NAS *est* le
          # tier dev, ce workflow ne construit rien d'autre.
          #
          # SENTRY_RELEASE = le sha du commit. C'est aussi le nom sous lequel le plugin injecte la
          # release dans le bundle, donc ce que le SDK rapportera : les sourcemaps et les erreurs se
          # retrouvent sous le même nom. #186 y mettra la version du produit.
          build-args: |
            ${{ matrix.image == 'cimavia-web' && format('VITE_API_URL={0}', vars.DEV_PUBLIC_API_URL) || '' }}
            ${{ matrix.image == 'cimavia-web' && format('VITE_SENTRY_DSN={0}', vars.DEV_SENTRY_DSN_WEB) || '' }}
            ${{ matrix.image == 'cimavia-web' && 'VITE_APP_ENV=development' || '' }}
            ${{ matrix.image == 'cimavia-web' && format('SENTRY_ORG={0}', vars.SENTRY_ORG) || '' }}
            ${{ matrix.image == 'cimavia-web' && format('SENTRY_PROJECT={0}', vars.SENTRY_PROJECT_WEB) || '' }}
            ${{ matrix.image == 'cimavia-web' && format('SENTRY_RELEASE={0}', github.sha) || '' }}
          # Le jeton passe par un SECRET BuildKit et non un build-arg : un ARG finit dans
          # `docker history` de l'image publiée sur GHCR. Absent, le build aboutit quand même et ne
          # publie simplement aucune sourcemap.
          secrets: |
            ${{ matrix.image == 'cimavia-web' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement sur le NAS
    needs: build-and-push
    # Runner self-hosted installé sur le NAS, étiqueté « cimavia-dev » : le job s'exécute donc
    # DANS le réseau du NAS (aucun port entrant à ouvrir — le runner sort vers GitHub). Le label
    # évite qu'un autre runner self-hosted ne récupère le job.
    runs-on: [self-hosted, cimavia-dev]
    permissions:
      contents: read
      packages: read # tire les images publiées par le job précédent, n'en publie aucune
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Le .env (secrets, hostnames, images) vit sur le NAS, hors git. DEV_ENV_FILE = son chemin
      # absolu (variable de dépôt). On échoue tôt s'il manque plutôt que de laisser compose partir
      # avec des variables vides.
      - name: Vérifier le fichier .env
        run: |
          if [ -z "${{ vars.DEV_ENV_FILE }}" ]; then
            echo "::error::Variable de dépôt DEV_ENV_FILE non définie (chemin du .env sur le NAS)."
            exit 1
          fi
          if [ ! -f "${{ vars.DEV_ENV_FILE }}" ]; then
            echo "::error::${{ vars.DEV_ENV_FILE }} introuvable sur le runner."
            exit 1
          fi

      - name: Login GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Pull & up
        env:
          COMPOSE_FILE: deploy/dev/docker-compose.yml
          ENV_FILE: ${{ vars.DEV_ENV_FILE }}
        run: |
          docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull
          docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --remove-orphans

      # Smoke check : l'API applique ses migrations au démarrage (entrypoint) puis écoute. On
      # sonde /health DEPUIS le conteneur (node y est présent) — pas besoin de l'URL publique ni
      # d'attendre Cloudflare. Le job échoue si l'API n'est pas saine, ce qui rend le déploiement
      # rouge dans GitHub.
      - name: Smoke check GET /health
        run: |
          for i in $(seq 1 30); do
            if docker exec cimavia_dev_api node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "✓ API saine après déploiement"
              exit 0
            fi
            echo "… attente de l'API ($i/30)"
            sleep 2
          done
          echo "::error::API non saine après déploiement — 50 dernières lignes de log :"
          docker logs --tail 50 cimavia_dev_api || true
          exit 1

      - name: Logout GHCR
        if: always()
        run: docker logout ghcr.io
