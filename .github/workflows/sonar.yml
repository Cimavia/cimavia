name: SonarCloud

on:
  push:
    branches: [main, staging, production]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PNPM_VERSION: "10.34.4"
  NODE_VERSION: "22"

# Moindre privilège : ces workflows ne font que lire le dépôt. La décoration des PR par
# SonarCloud passe par sa GitHub App, pas par ce token.
permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    env:
      # Même DSN factice que la CI, sans identifiants (cf. ci.yml) : `prisma generate` a besoin de
      # la variable, pas d'une base.
      DATABASE_URL: postgresql://localhost:5432/placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm --filter @cmv/api exec prisma generate

      # La couverture doit exister AVANT le scan : sans lcov, Sonar ne lit pas « 0 % », il ne lit
      # rien — et la Quality Gate échoue sur `new_coverage` quoi qu'on écrive.
      - name: Test with coverage
        run: pnpm turbo test

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Token créé à l'étape 1 → à ajouter dans les secrets GitHub
          SONAR_HOST_URL: https://sonarcloud.io
