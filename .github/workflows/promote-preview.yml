name: Promotion — preview

# Envoie une version PUBLIÉE chez le Coach bêta (#266). Lancé à la main, jamais par un push : c'est
# la décision humaine entre un merge sur `main` et les vraies données du NAS (#260).
#
# Le NAS ne reçoit plus rien de GitHub. Il tire lui-même le tag `preview` des images, toutes les
# 5 minutes (`deploy/preview/pull-preview.sh`) : ce workflow se contente de DÉPLACER ce tag, puis attend
# de voir le NAS redémarrer.
#
#   1. vérifier   — la version existe, avance, a passé ses checks, et ses DEUX images sont publiées ;
#   2. publier    — `preview` sur l'image de l'API et sur celle du web, sans les reconstruire (#186,
#                   et pour le web depuis #417 : il lit sa config de tier au démarrage), puis la
#                   branche `preview` avancée jusqu'au tag ;
#   3. confirmer  — l'API du NAS a redémarré et répond.
#
# Si seule la confirmation échoue (NAS éteint, jeton GHCR expiré…), « Re-run failed jobs » la
# relance sans rien republier : relancer tout le workflow serait refusé, la version étant déjà celle
# de `preview`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version publiée à envoyer sur preview, sans « v » (ex. 1.2.2)"
        required: true
        type: string

# Une promotion à la fois : deux retags croisés laisseraient l'API d'une version et le web de l'autre.
concurrency:
  group: promote-preview
  cancel-in-progress: false

# Aucun droit par défaut : chaque job déclare les siens.
permissions: {}

jobs:
  verify:
    name: Vérifier la version
    runs-on: ubuntu-26.04
    timeout-minutes: 5 # 16 s au plus observé
    permissions:
      contents: read
      checks: read # les trois checks requis du commit promu, relus avant de promouvoir
      packages: read # les deux images, cherchées sur GHCR avant d'être retaguées
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      registry: ${{ steps.version.outputs.registry }}
    steps:
      # L'entrée passe par l'environnement, jamais interpolée dans le script : une valeur tapée à la
      # main ne doit pas pouvoir devenir du shell.
      - name: Format de la version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::« $VERSION » n'est pas un numéro de version X.Y.Z."
            exit 1
          fi

      # Historique complet : il faut les tags, `main` et `preview` pour comparer.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le jeton n'est pas laissé dans `.git/config` : ce job ne pousse rien (seul `publish` le
          # fait, avec le jeton de l'App), et une action tierce qui lirait le dépôt n'y trouverait rien.
          persist-credentials: false
          fetch-depth: 0

      - name: La version, sa place dans l'historique
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/v${VERSION}^{commit}")"; then
            echo "::error::Le tag v${VERSION} n'existe pas : seule une version publiée se promeut."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::v${VERSION} n'est pas sur main."
            exit 1
          fi

          # Jamais en arrière, jamais deux fois : une version plus ancienne tournerait sur un schéma
          # déjà migré par la plus récente. Un retour se fait par restauration (#268) ou correctif.
          # Avant la toute première promotion, `preview` pointe sur un commit de P0 : 0.0.0.
          current="$(git show origin/preview:package.json 2>/dev/null | jq -r '.version // empty' || true)"
          current="${current:-0.0.0}"
          highest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)"
          if [ "$VERSION" = "$current" ] || [ "$highest" != "$VERSION" ]; then
            echo "::error::preview est en ${current} : v${VERSION} ne la fait pas avancer."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/preview "$sha"; then
            echo "::error::La branche preview n'est pas un ancêtre de v${VERSION} : avance impossible sans réécrire."
            exit 1
          fi

          {
            echo "sha=$sha"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::preview ${current} → ${VERSION} (${sha::7})"

      # Les trois checks que le ruleset exigeait avant que la promotion ne passe par ce workflow. Le
      # commit promu les a passés sur `main` ; on le vérifie au lieu de le croire. En cas de relance
      # d'un check, seul le dernier passage compte.
      - name: Checks requis verts sur ce commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")"
          failed=0
          for name in "Lint + Typecheck + Test" "E2E (isolation multi-tenant)" "SonarCloud Analysis"; do
            conclusion="$(jq -r --arg n "$name" '[.check_runs[] | select(.name == $n)] | sort_by(.started_at) | last | .conclusion // "absent"' <<<"$runs")"
            echo "${name} : ${conclusion}"
            [ "$conclusion" = "success" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Un check requis n'est pas vert sur ${SHA::7} : cette version ne part pas chez le Coach."
            exit 1
          fi

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le tag versionné n'est posé que sur le commit de bump, et seulement si l'image s'est
      # construite (#186) PUIS a démarré (#415 pour l'API, #417 pour le web). Absent, il n'y a rien
      # à retaguer : on ne reconstruit pas pour autant.
      #
      # Une version publiée AVANT #417 n'a pas d'image web `X.Y.Z` : elle ne se promeut plus, ce qui
      # ne coûte rien, la promotion ne revenant jamais en arrière.
      - name: Images publiées
        env:
          REGISTRY: ${{ steps.version.outputs.registry }}
          VERSION: ${{ inputs.version }}
        run: |
          failed=0
          for image in cimavia-api cimavia-web; do
            if ! docker buildx imagetools inspect "${REGISTRY}/${image}:${VERSION}" >/dev/null 2>&1; then
              echo "::error::${image}:${VERSION} introuvable : la construction ou le smoke test du commit de release a-t-il échoué ?"
              failed=1
            fi
          done
          exit "$failed"

      # La sonde de `confirm` : vide, la promotion déplacerait les tags puis attendrait 20 minutes une
      # réponse qu'elle ne peut pas recevoir. Le web, lui, ne la lit plus (#417).
      - name: Vérifier PREVIEW_PUBLIC_API_URL
        env:
          API_URL: ${{ vars.PREVIEW_PUBLIC_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Variable de dépôt PREVIEW_PUBLIC_API_URL vide — impossible de confirmer le redémarrage du NAS."
            exit 1
          fi

  publish:
    name: Publier sur preview
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 5 # 31 s au plus observé
    permissions:
      contents: read
      packages: write # retague les deux images en `preview` ; la branche passe par le jeton de l'App
    outputs:
      promoted_at: ${{ steps.branch.outputs.promoted_at }}
    steps:
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La promotion RETAGUE, elle ne reconstruit pas (#186) : `preview` désigne l'image validée sur
      # `main`, à l'octet près — le web aussi depuis #417. On le vérifie par le digest plutôt que de
      # le supposer.
      - name: preview sur les images de la version
        env:
          REGISTRY: ${{ needs.verify.outputs.registry }}
          VERSION: ${{ inputs.version }}
        run: |
          for image in cimavia-api cimavia-web; do
            src="$(docker buildx imagetools inspect "${REGISTRY}/${image}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
            docker buildx imagetools create --tag "${REGISTRY}/${image}:preview" "${REGISTRY}/${image}@${src}"
            dst="$(docker buildx imagetools inspect "${REGISTRY}/${image}:preview" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ "$src" != "$dst" ]; then
              echo "::error::${image}:preview (${dst}) n'est pas l'image de ${VERSION} (${src})."
              exit 1
            fi
            echo "${image}:preview → ${src}"
          done

      # Le jeton de l'App de release, seule exception au ruleset qui protège `preview` : un
      # `GITHUB_TOKEN` ne peut pas passer outre une règle « Restrict updates ».
      #
      # Restreint à `contents` : sans `permission-*`, le jeton hériterait de TOUS les droits de
      # l'installation, dont l'écriture des PR dont ce job n'a que faire.
      - name: Jeton d'installation de l'App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Le SEUL checkout qui garde ses identifiants : l'étape suivante pousse `preview` avec eux.
      # Le jeton de l'App reste donc dans `.git/config` jusqu'à la fin du job, qui n'exécute plus
      # rien d'autre et ne publie aucun artefact — d'où l'exception à `artipacked`.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Une avance, jamais une réécriture : le ruleset refuserait un non-fast-forward, et le job
      # `verify` a déjà établi que `preview` est un ancêtre du tag. La branche dit ce qui tourne chez
      # le Coach.
      - name: Avancer la branche preview
        id: branch
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          git push origin "${SHA}:refs/heads/preview"
          echo "promoted_at=$(date +%s)" >> "$GITHUB_OUTPUT"

  confirm:
    name: Attendre le NAS
    needs: [verify, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      # Le NAS tire toutes les 5 minutes, puis télécharge, migre et attend sa propre sonde : compter
      # jusqu'à 20 minutes. `/health` est public mais ne dit pas la version, et c'est voulu (#186) :
      # on reconnaît le redémarrage à un `uptime` plus court que le temps écoulé depuis la promotion.
      # Un redémarrage sans rapport dans cette fenêtre tromperait la sonde ; c'est improbable, et
      # `/health/ready` reste exigé derrière.
      - name: L'API du NAS a redémarré et répond
        env:
          API_URL: ${{ vars.PREVIEW_PUBLIC_API_URL }}
          PROMOTED_AT: ${{ needs.publish.outputs.promoted_at }}
          VERSION: ${{ inputs.version }}
        run: |
          deadline=$((PROMOTED_AT + 20 * 60))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            elapsed=$(( $(date +%s) - PROMOTED_AT ))
            if uptime="$(curl -fsS --max-time 10 "${API_URL%/}/health" | jq -r '.uptime // empty')" && [ -n "$uptime" ]; then
              if awk -v u="$uptime" -v e="$elapsed" 'BEGIN { exit !(u < e) }' \
                && curl -fsS --max-time 10 "${API_URL%/}/health/ready" >/dev/null; then
                echo "::notice::v${VERSION} est en ligne sur le NAS (API redémarrée il y a ${uptime%.*} s)."
                exit 0
              fi
              echo "… API en ligne depuis ${uptime%.*} s, pas encore redémarrée (${elapsed} s écoulées)"
            else
              echo "… API injoignable (${elapsed} s écoulées) — redémarrage probablement en cours"
            fi
            sleep 20
          done
          echo "::error::Le NAS n'a pas redémarré sur v${VERSION} en 20 minutes. À regarder sur le NAS : la tâche planifiée, pull-preview/pull-preview.log (jeton GHCR, .env, migration), puis « Re-run failed jobs »."
          exit 1
