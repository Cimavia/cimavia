name: Images — API (GHCR)

# Un push sur `main` publie l'image de l'API sur GHCR, et rien d'autre : plus aucun déploiement ne
# part d'ici (#266). Le NAS tire lui-même la version PROMUE (`promote-preview.yml` pose le tag
# `preview`, `deploy/preview/pull-preview.sh` le tire), et c'est cette promotion qui exige des checks
# verts. Un test rouge ne bloque donc pas la publication d'une image : il bloque son envoi chez le
# Coach.
#
# L'image WEB ne se construit plus ici. Elle fige l'URL de l'API au build et se reconstruit par tier,
# depuis le tag de la version, au moment de la promotion (#186). La construire aussi sur `main` ne
# servait plus personne, et aurait téléversé ses sourcemaps sous le même nom de release Sentry que
# le build de promotion.
#
# Le nom du fichier suit encore l'ancien rôle : son renommage appartient à #271.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-image.yml"
      # Le commit de bump de `release-please` ne touche QUE ces deux fichiers. Sans eux ici, il ne
      # construirait rien : l'image `X.Y.Z` n'existerait pas, et la version serait impossible à
      # promouvoir.
      - "package.json"
      - "CHANGELOG.md"

# PAS de `concurrency` : l'ancien groupe par branche annulait la construction en cours au push
# suivant, et remplaçait de toute façon une exécution en attente par la plus récente. Un merge suivant
# de près la PR de release suffisait à perdre l'image `X.Y.Z` — la seule que la promotion sait
# retaguer. Chaque commit construit donc la sienne, jusqu'au bout.

# Aucun droit par défaut : le job déclare les siens (moindre privilège).
permissions: {}

jobs:
  build-and-push:
    name: Build & push cimavia-api → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # `fetch-depth: 2` : l'étape « Version du produit » compare le `package.json` de HEAD à celui
      # de HEAD~1 pour savoir si CE commit est le bump. Un clone superficiel d'un seul commit ne
      # permettrait pas la comparaison.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      # GHCR exige un namespace en minuscules ; le propriétaire du dépôt peut contenir des
      # majuscules. On le normalise une fois ici.
      - name: Namespace GHCR (minuscules)
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # La version du produit et l'identité du build, lues À LA SOURCE (`package.json` racine) et
      # jamais recopiées ailleurs.
      #
      # `is_release` répond à « ce commit EST-il le bump ? » en comparant la version à celle du
      # commit précédent. On ne s'appuie PAS sur le tag `vX.Y.Z` : `release.yml` le pose en réaction
      # au MÊME push, et l'ordre des deux workflows n'est pas garanti — le tag pourrait ne pas
      # exister encore ici. Le contenu du fichier, lui, est déjà là.
      #
      # C'est ce qui rend le tag Docker versionné IMMUABLE : entre deux releases le numéro ne bouge
      # pas alors que le code, lui, est republié à chaque push. Poser `1.2.0` à chaque fois en
      # ferait une étiquette qui change de contenu, c'est-à-dire qui ment.
      - name: Version du produit
        id: version
        run: |
          version="$(jq -r .version package.json)"
          previous="$(git show HEAD~1:package.json 2>/dev/null | jq -r .version || echo "")"
          {
            echo "version=$version"
            echo "build=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          if [ "$version" != "$previous" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Commit de release : l'image sera aussi taguée $version."
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag immuable par SHA (traçabilité) + le NUMÉRO, mais uniquement sur le commit qui le fait
      # avancer : c'est lui que la promotion retague. Plus de tag mobile `dev` : plus personne ne le
      # tire depuis que le NAS suit `preview`.
      #
      # `enable` sur le numéro est le cœur du sujet : entre deux releases, dix pushes produisent dix
      # images différentes sous le MÊME numéro. Les taguer toutes `1.2.0` rendrait cette étiquette
      # mouvante — et un tag de version qui change de contenu ne vaut pas mieux que pas de tag du
      # tout. Elle n'est posée qu'une fois, sur l'image qui est vraiment cette version.
      #
      # Les étiquettes OCI qu'ajoute cette action portent `org.opencontainers.image.revision` : c'est
      # par elle que le NAS retrouve le commit d'une image, donc le compose qui va avec.
      - name: Métadonnées (tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ steps.ns.outputs.owner }}/cimavia-api
          tags: |
            type=sha
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_release == 'true' }}

      # Les deux moitiés de l'identité voyagent SÉPARÉMENT : Swagger et `GET /version` veulent le
      # numéro nu, seul `instrument.ts` recolle `1.2.0+3f2a1c` pour Sentry (#186).
      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          # Le NAS (DS720+) est en x86_64 : build natif amd64, pas d'émulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_BUILD=${{ steps.version.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
