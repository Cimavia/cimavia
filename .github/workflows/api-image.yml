name: Images — API (GHCR)

# Un push sur `main` publie l'image de l'API sur GHCR, la démarre sur une base jetable avant de lui
# donner son numéro de version (#415), la fait scanner par Trivy (#399), et rien d'autre : plus
# aucun déploiement ne part d'ici (#266). Le NAS tire lui-même la version PROMUE
# (`promote-preview.yml` pose le tag `preview`, `deploy/preview/pull-preview.sh` le tire), et c'est
# cette promotion qui exige des checks
# verts. Un test rouge ne bloque donc pas la publication d'une image : il bloque son envoi chez le
# Coach.
#
# L'image WEB ne se construit plus ici. Elle fige l'URL de l'API au build et se reconstruit par tier,
# depuis le tag de la version, au moment de la promotion (#186). La construire aussi sur `main` ne
# servait plus personne, et aurait téléversé ses sourcemaps sous le même nom de release Sentry que
# le build de promotion.
#
# Le nom du fichier suit encore l'ancien rôle : son renommage appartient à #271.

# `concurrency-limits` écarté : l'absence de `concurrency` est voulue, voir plus bas.
on: # zizmor: ignore[concurrency-limits]
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-image.yml"
      - ".github/actions/product-version/**"
      # Le commit de bump de `release-please` ne touche QUE ces deux fichiers. Sans eux ici, il ne
      # construirait rien : l'image `X.Y.Z` n'existerait pas, et la version serait impossible à
      # promouvoir.
      - "package.json"
      - "CHANGELOG.md"

# PAS de `concurrency` : l'ancien groupe par branche annulait la construction en cours au push
# suivant, et remplaçait de toute façon une exécution en attente par la plus récente. Un merge suivant
# de près la PR de release suffisait à perdre l'image `X.Y.Z` — la seule que la promotion sait
# retaguer. Chaque commit construit donc la sienne, jusqu'au bout.

# Aucun droit par défaut : le job déclare les siens (moindre privilège).
permissions: {}

jobs:
  build-and-push:
    name: Build & push cimavia-api → GHCR
    runs-on: ubuntu-26.04
    timeout-minutes: 25 # 4 min 56 observé smoke test compris (#415), 6 min 09 au plus sans lui
    permissions:
      contents: read
      packages: write # pousse l'image de l'API sur GHCR
    outputs:
      image: ghcr.io/${{ steps.ns.outputs.owner }}/cimavia-api@${{ steps.build.outputs.digest }}
      pushed: ${{ steps.build.outcome == 'success' }}

    steps:
      # `fetch-depth: 2` : l'action « Version du produit » compare le `package.json` de HEAD à celui
      # de HEAD~1 pour savoir si CE commit est le bump. Un clone superficiel d'un seul commit ne
      # permettrait pas la comparaison.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le jeton n'est pas laissé dans `.git/config` : aucune étape ne pousse, et un artefact
          # ou une action tierce qui lirait le dépôt n'y trouverait rien.
          persist-credentials: false
          fetch-depth: 2

      # GHCR exige un namespace en minuscules ; le propriétaire du dépôt peut contenir des
      # majuscules. On le normalise une fois ici.
      - name: Namespace GHCR (minuscules)
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Le numéro, le sha court, et « ce commit est-il le bump ? » : la même réponse que
      # `web-image.yml`, d'où l'action partagée (#417).
      - name: Version du produit
        id: version
        uses: $/.github/actions/product-version

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Seul le tag immuable par SHA (traçabilité) est posé au build. Le NUMÉRO, lui, attend que
      # l'image ait démarré : c'est le tag que la promotion retague, il dit « promouvable » (#415).
      # Plus de tag mobile `dev` : plus personne ne le tire depuis que le NAS suit `preview`.
      #
      # Les étiquettes OCI qu'ajoute cette action portent `org.opencontainers.image.revision` : c'est
      # par elle que le NAS retrouve le commit d'une image, donc le compose qui va avec.
      - name: Métadonnées (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.ns.outputs.owner }}/cimavia-api
          tags: type=sha

      # Les deux moitiés de l'identité voyagent SÉPARÉMENT : Swagger et `GET /version` veulent le
      # numéro nu, seul `instrument.ts` recolle `1.2.0+3f2a1c` pour Sentry (#186).
      - name: Build & push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          # Le NAS (DS720+) est en x86_64 : build natif amd64, pas d'émulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_BUILD=${{ steps.version.outputs.build }}
          # Un scope par image (#414) : sans lui, l'API et le web écrivaient le MÊME index de cache
          # (`buildkit`, le défaut), chacun effaçant celui de l'autre. Les builds de PR de `ci.yml`
          # relisent ce scope sans l'écrire.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # ── Smoke test (#415) ─────────────────────────────────────────────────────────────────────
      # Un build vert ne dit pas que l'image démarre : un client Prisma non généré, une variable
      # d'env refusée, une migration qui ne passe pas ne se voient qu'au lancement. Sans ce smoke,
      # ce lancement avait lieu sur le NAS, APRÈS que `pull-preview.sh` a remplacé les conteneurs
      # qui marchaient — et sans retour arrière (« Tranché en #266 »).
      #
      # Sur CHAQUE build, pas seulement le bump : une image `sha-*` qui ne démarre pas est aussi un
      # signal. Elle reste publiée, mais ne recevra jamais de numéro.

      # Le même compose que les e2e : une base vide, que l'entrypoint migre depuis zéro — donc
      # toutes les migrations du dépôt. Ça ne prouve PAS la migration du NAS, qui part du schéma de
      # la version précédente et de vraies données : ça, c'est la restauration de #268.
      - name: Démarre la base jetable (5434)
        run: docker compose -f apps/api/docker-compose.test.yml up -d --wait

      # L'image par son DIGEST, tirée de GHCR : c'est l'artefact publié qui démarre, celui que le
      # numéro désignera, pas une copie restée dans le cache du builder.
      #
      # L'environnement de production minimal, sans aucun identifiant réel : la base est celle du
      # compose ci-dessus, dont les identifiants sont LUS plutôt que recopiés — le compose reste leur
      # seule source, et le smoke suit s'il change. Le secret est factice, et l'URL publique ne se résout pas — l'API ne
      # l'appelle jamais au démarrage. Valeurs conformes à ce que #357 exige d'un tier déployé :
      # secret de 32 caractères au moins, URL en https, et un jeton Expo — factice lui aussi, Expo
      # n'étant appelé qu'à l'envoi d'un push. `SIGNUP_MODE` n'a pas de défaut (#263) :
      # absente, l'API refuserait de démarrer, et le smoke rougirait pour une raison qui n'est pas
      # l'image.
      #
      # `--health-interval` raccourcit l'intervalle de la sonde (30 s dans l'image) sans en changer
      # la commande : c'est bien la `HEALTHCHECK` de l'image qui est jugée, sans attendre 30 s son
      # premier passage.
      - name: Démarre l'image publiée
        id: smoke
        env:
          IMAGE: ghcr.io/${{ steps.ns.outputs.owner }}/cimavia-api@${{ steps.build.outputs.digest }}
          NODE_ENV: production
          APP_ENV: preview
          BETTER_AUTH_SECRET: smoke-test-secret-not-for-production-0123456789
          BETTER_AUTH_URL: https://api.example.invalid
          EXPO_ACCESS_TOKEN: smoke-test-expo-token-not-for-production
          SIGNUP_MODE: invitation
        run: |
          pg="$(docker compose -f apps/api/docker-compose.test.yml config --format json \
            | jq -c '.services["postgres-e2e"].environment')"
          user="$(jq -r .POSTGRES_USER <<<"$pg")"
          password="$(jq -r .POSTGRES_PASSWORD <<<"$pg")"
          db="$(jq -r .POSTGRES_DB <<<"$pg")"
          export DATABASE_URL="postgresql://${user}:${password}@localhost:5434/${db}?schema=public"
          docker run -d --name cimavia-smoke --network host --health-interval 3s \
            -e NODE_ENV -e APP_ENV -e DATABASE_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL \
            -e EXPO_ACCESS_TOKEN -e SIGNUP_MODE \
            "$IMAGE"

      # `healthy` est la sonde de l'image (liveness, `/health`). Un conteneur arrêté ou `unhealthy`
      # fait échouer tout de suite, sans attendre la borne : l'entrypoint est en `set -e`, une
      # migration ou une env refusée arrête le conteneur. La borne ne sert qu'à l'API qui ne répond
      # jamais sans mourir.
      - name: Attend que l'API soit saine
        run: |
          deadline=$((SECONDS + 180))
          while :; do
            state="$(docker inspect -f '{{.State.Status}}/{{.State.Health.Status}}' cimavia-smoke)"
            case "$state" in
              running/healthy) break ;;
              running/starting) ;;
              *)
                echo "::error::L'image ne démarre pas (${state})."
                exit 1
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::L'API n'est pas saine après 180 s (${state})."
              exit 1
            fi
            sleep 3
          done

      # `/health` ne touche pas la base ; `/health/ready` si. C'est elle qui prouve que le client
      # Prisma de l'image parle à Postgres — la panne que le `Dockerfile` décrit (« l'API démarre
      # puis échoue à la première requête »).
      - name: Readiness
        run: curl -fsS --max-time 10 http://127.0.0.1:3000/health/ready

      # SEULEMENT maintenant, et sur le commit de bump seulement : le numéro sur le digest qui vient
      # de démarrer. Même mécanisme que la promotion — un retag, jamais un rebuild (#186).
      #
      # Entre deux releases, dix pushes produisent dix images sous le MÊME numéro dans
      # `package.json`. Le poser à chaque fois ferait de `1.2.0` une étiquette qui change de contenu,
      # c'est-à-dire qui ment : il n'est posé qu'une fois, sur l'image qui est vraiment cette version.
      - name: Tag de version
        if: steps.version.outputs.is_release == 'true'
        env:
          REPO: ghcr.io/${{ steps.ns.outputs.owner }}/cimavia-api
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx imagetools create --tag "${REPO}:${VERSION}" "${REPO}@${DIGEST}"

      # Seulement si le conteneur existe : un échec du build ou de la base se lit dans son étape.
      - name: Logs de l'API (si échec)
        if: failure() && steps.smoke.outcome == 'success'
        run: docker logs cimavia-smoke 2>&1 | tail -n 200

  # ── Trivy (#399) ──────────────────────────────────────────────────────────────────────────────
  # Un job À PART, pas une étape de plus : celui-ci ne peut que LIRE les images, et Trivy n'y croise
  # jamais le jeton (`.github/actions/trivy-scan`). Le job qui pousse garde son droit d'écriture
  # pour lui seul.
  #
  # Dès que l'image est poussée, même si le smoke échoue : elle reste publiée sous `sha-*`.
  # Les dépendances npm de l'app (`app/node_modules`) ne sont pas relues ici : Dependabot les suit
  # déjà, et ses rejets motivés (#398) devraient sinon être recopiés dans `.trivyignore.yaml`.
  scan:
    name: Trivy — image de l'API
    needs: build-and-push
    if: ${{ !cancelled() && needs.build-and-push.outputs.pushed == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # l'image de l'API est privée
      security-events: write # envoie le SARIF à Code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyse
        uses: $/.github/actions/trivy-scan
        with:
          image: ${{ needs.build-and-push.outputs.image }}
          registry-login: "true"
          skip-dirs: app/node_modules
          category: trivy-api
