version: 2

# Les actions sont épinglées par SHA (sécurité : un tag est mutable, un commit non). Contrepartie :
# plus rien ne les met à jour tout seul — d'où Dependabot, qui rouvre le sujet chaque semaine et
# réécrit le SHA *avec* son commentaire de version. Sans lui, l'épinglage devient de l'obsolescence.
updates:
  - package-ecosystem: github-actions
    # `/` seul ne couvre que `.github/workflows` et un `action.yml` à la racine : les actions
    # composites de `.github/actions/` doivent être nommées, sinon ce qu'elles appellent n'est plus
    # jamais mis à jour (#413).
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # Une version n'est proposée qu'après 7 jours de publication. Une action compromise est en
    # général repérée et retirée dans ce délai : on laisse les autres essuyer les plâtres plutôt que
    # d'exécuter en CI, avec nos secrets, un code sorti la veille. Les mises à jour de SÉCURITÉ,
    # elles, n'attendent pas : le délai ne s'applique pas à elles.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - "type: chore"
    groups:
      # Un seul PR pour toute la CI plutôt qu'un par action : ces mises à jour se relisent ensemble.
      actions:
        patterns:
          - "*"
