<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:400px; height:100%; box-sizing:border-box; background:#0e141a; border-left:1px solid #2b3742; overflow-y:auto; padding:22px; font-family:'IBM Plex Sans',sans-serif; color:#dceff3">
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:16px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b93a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 9.5 H20.5"></path><path d="M8 3.2 V6.2 M16 3.2 V6.2"></path></svg><span style="font:500 13px/18px 'IBM Plex Sans',sans-serif; color:#6b93a0">{{ pv.label }}</span></div>
  <div style="background:#0a0f14; border:1px solid #2b3742; border-radius:16px; padding:20px 18px">
    <sc-if value="{{ pv.isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center; padding:22px 8px">
        <div style="font:600 16px/21px 'Space Grotesk',sans-serif; color:#dceff3; margin-bottom:8px">{{ pv.emptyTitle }}</div>
        <div style="font:400 15px/25px 'IBM Plex Sans',sans-serif; color:#aab6c2; text-wrap:pretty">{{ pv.emptyTxt }}</div>
      </div>
    </sc-if>
    <sc-if value="{{ pv.hasContent }}" hint-placeholder-val="{{ true }}">
      <div style="font:700 16px/21px 'Space Grotesk',sans-serif; color:#dceff3; margin-bottom:4px">{{ pv.title }}</div>
      <div style="font:400 13px/18px 'IBM Plex Sans',sans-serif; color:#6b93a0">{{ pv.sub }}</div>
      <sc-if value="{{ pv.hasNote }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:14px"><div style="font:600 13px/18px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:#6b93a0; margin-bottom:4px">Note du coach</div><div style="background:#141d25; border-left:3px solid #c2603a; border-radius:6px; padding:10px 12px"><span style="font:400 15px/25px 'IBM Plex Sans',sans-serif; color:#aab6c2">{{ pv.note }}</span></div></div>
      </sc-if>
      <sc-for list="{{ pv.blocks }}" as="b" hint-placeholder-count="3">
        <div style="margin-top:16px; padding-top:16px; border-top:1px solid #2b3742">
          <sc-if value="{{ b.isSingle }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; align-items:baseline; gap:8px"><span style="font:600 13px/1 'IBM Plex Mono',monospace; color:#e8966f">{{ b.head }}</span><span style="font:600 16px/21px 'Space Grotesk',sans-serif; color:#dceff3">{{ b.name }}</span></div>
            <div style="font:400 15px/25px 'IBM Plex Sans',sans-serif; color:#aab6c2; margin-top:2px; text-wrap:pretty">{{ b.sum }}</div>
            <sc-if value="{{ b.consigne }}" hint-placeholder-val="{{ false }}"><div style="margin-top:8px; background:#141d25; border:1px solid #2b3742; border-radius:8px; padding:9px 12px"><div style="font:600 13px/18px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:#6b93a0">Consigne</div><div style="font:400 15px/22px 'IBM Plex Sans',sans-serif; color:#dceff3; margin-top:2px">{{ b.consigne }}</div></div></sc-if>
          </sc-if>
          <sc-if value="{{ b.notSingle }}" hint-placeholder-val="{{ true }}">
          <div style="font:600 13px/18px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:#e8966f">{{ b.head }}</div>
          <sc-if value="{{ b.hasSum }}" hint-placeholder-val="{{ true }}"><div style="font:400 13px/18px 'IBM Plex Sans',sans-serif; color:#aab6c2; margin-top:4px; text-wrap:pretty">{{ b.sum }}</div></sc-if>
          <sc-if value="{{ b.consigne }}" hint-placeholder-val="{{ false }}"><div style="margin-top:8px; background:#141d25; border:1px solid #2b3742; border-radius:8px; padding:9px 12px"><div style="font:600 13px/18px 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:#6b93a0">Consigne</div><div style="font:400 15px/22px 'IBM Plex Sans',sans-serif; color:#dceff3; margin-top:2px">{{ b.consigne }}</div></div></sc-if>
          <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px; padding-left:12px; border-left:2px solid #2b3742">
            <sc-for list="{{ b.items }}" as="it" hint-placeholder-count="2">
              <div>
                <div style="display:flex; align-items:baseline; gap:8px"><sc-if value="{{ it.hasCode }}" hint-placeholder-val="{{ true }}"><span style="font:600 13px/1 'IBM Plex Mono',monospace; color:#6b93a0">{{ it.code }}</span></sc-if><span style="font:600 16px/21px 'Space Grotesk',sans-serif; color:#dceff3">{{ it.name }}</span></div>
                <sc-if value="{{ it.hasTxt }}" hint-placeholder-val="{{ false }}"><div style="font:400 15px/25px 'IBM Plex Sans',sans-serif; color:#aab6c2; margin-top:2px">{{ it.txt }}</div></sc-if>
                <sc-if value="{{ it.hasNote }}" hint-placeholder-val="{{ false }}"><div style="margin-top:8px; background:#141d25; border-left:3px solid #c2603a; border-radius:6px; padding:10px 12px"><span style="font:400 15px/25px 'IBM Plex Sans',sans-serif; color:#aab6c2">{{ it.note }}</span></div></sc-if>
              </div>
            </sc-for>
          </div>
          </sc-if>
        </div>
      </sc-for>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:860},&quot;pv&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
