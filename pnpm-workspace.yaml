packages:
  - "apps/*"
  - "packages/*"

# Correctifs de sécurité des dépendances TRANSITIVES (#398). `pnpm up --depth Infinity` ne les
# remonte pas : une dépendance transitive reste à la version du lockfile tant qu'on ne la force pas.
#
# La règle : un override par correctif publié DANS LA MÊME MAJEURE que la version vulnérable, et
# borné à cette majeure par son sélecteur. Il ne vise que les versions vulnérables : une fois que
# l'amont a monté, il ne s'applique plus à rien, et peut partir. Le vérifier en le retirant :
# `pnpm install` puis `pnpm audit` ne doivent pas le faire réapparaître.
#
# Hors de cette liste, et donc rejetés dans les alertes Dependabot avec leur raison : les
# correctifs qui exigent une MAJEURE (deepmerge-ts, image-size, decode-uri-component,
# postcss-selector-parser, qui attend Tailwind 4 ; et depuis #734 le `zod` 3 et le `glob` 13
# d'`@expo/cli`, le `minimatch` de l'outillage Expo, Nest et Stryker), ceux que l'amont n'a pas
# publiés (braces, deepmerge, la vérification de signature PKCS#1 de node-forge), et ce qu'un
# paquet épingle à la version exacte : `fastify` suit `@nestjs/platform-fastify`, c'est le serveur
# HTTP.
#
# Revue en #734 : dix-neuf overrides ne visaient plus rien (retirés, `pnpm audit` ne les fait pas
# revenir) — l'amont a monté, et `hono` a quitté la CLI prisma en 7.10.
overrides:
  # Runtime de l'API — expo-server-sdk (undici), @thallesp/nestjs-better-auth (qs), fastify (ajv).
  "undici@>=7 <7.30.1": "^7.30.1"
  "qs@>=6 <6.16.1": "^6.16.1"
  "fast-uri@>=3 <3.1.9": "^3.1.9"
  "fast-uri@>=4 <4.2.3": "^4.2.3"
  # Chaîne de build mobile — @expo/cli et la signature de code des updates. Jamais dans une image.
  "node-forge@>=1 <1.4.1": "^1.4.1"
