packages:
  - "apps/*"
  - "packages/*"

# Correctifs de sécurité des dépendances TRANSITIVES (#398). `pnpm up --depth Infinity` ne les
# remonte pas : une dépendance transitive reste à la version du lockfile tant qu'on ne la force pas.
#
# La règle : un override par correctif publié DANS LA MÊME MAJEURE que la version vulnérable, et
# borné à cette majeure par son sélecteur. Il ne vise que les versions vulnérables : une fois que
# l'amont a monté, il ne s'applique plus à rien, et peut partir. Le vérifier en le retirant :
# `pnpm install` puis `pnpm audit` ne doivent pas le faire réapparaître.
#
# Hors de cette liste, et donc rejetés dans les alertes Dependabot avec leur raison : les
# correctifs qui exigent une MAJEURE (deepmerge-ts, image-size, uuid, decode-uri-component), et
# `fastify` lui-même, que `@nestjs/platform-fastify` épingle à la version exacte : c'est le serveur
# HTTP, il suit Nest.
overrides:
  # Runtime de l'API — expo-server-sdk, @thallesp/nestjs-better-auth, fastify (ajv).
  "undici@>=7 <7.29.0": "^7.29.0"
  "qs@>=6 <6.16.0": "^6.16.0"
  "fast-uri@>=3 <3.1.6": "^3.1.6"
  # CLI prisma, présent dans l'image pour `migrate deploy` : `prisma dev` et le pilote MySQL, jamais
  # chargés par l'API.
  "mysql2@>=3 <3.23.1": "^3.23.1"
  "hono@>=4 <4.13.5": "^4.13.5"
  "@hono/node-server@>=1 <1.19.15": "^1.19.15"
  "valibot@>=1 <1.4.2": "^1.4.2"
  # Chaîne de build — Expo/metro, babel, tailwind, commitlint, @nestjs/cli.
  "@xmldom/xmldom@>=0.8 <0.8.15": "^0.8.15"
  "@xmldom/xmldom@>=0.9 <0.9.12": "^0.9.12"
  "brace-expansion@>=1 <1.1.18": "^1.1.18"
  "brace-expansion@>=5 <5.0.9": "^5.0.9"
  "browserslist@>=4 <4.28.7": "^4.28.7"
  "baseline-browser-mapping@>=2 <2.11.0": "^2.11.0"
  "js-yaml@>=4 <4.3.2": "^4.3.2"
  "nanoid@>=3 <3.3.18": "^3.3.18"
  "postcss@>=8 <8.5.23": "^8.5.23"
