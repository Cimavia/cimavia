sonar.projectKey=cimavia
sonar.organization=cimavia

# Les trois couches sont analysées. Le web et le mobile y sont entrés une fois qu'ils ont porté de
# la logique (dérivations d'état, composants du design system) et non plus seulement du rendu.
# Mobile n'a pas de `src/` : ses sources sont `app/` (routing), `feature/` et `shared/`.
sonar.sources=\
  apps/api/src,\
  apps/web/src,\
  apps/mobile/app,\
  apps/mobile/feature,\
  apps/mobile/shared,\
  packages/shared/src,\
  packages/tokens/src
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  apps/api/src/generated/**,\
  apps/mobile/.expo/**,\
  docs/**

sonar.tests=apps/api/src,packages/shared/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Un tsconfig par projet analysé : sans celui du web et du mobile, l'analyse de type des .tsx est
# dégradée (alias `@/` non résolus) et remonte du faux positif.
sonar.typescript.tsconfigPaths=\
  apps/api/tsconfig.json,\
  apps/web/tsconfig.json,\
  apps/mobile/tsconfig.json

sonar.sourceEncoding=UTF-8
