sonar.projectKey=cimavia
sonar.organization=cimavia

# Les trois couches sont analysées. Le web et le mobile y sont entrés une fois qu'ils ont porté de
# la logique (dérivations d'état, composants du design system) et non plus seulement du rendu.
# Mobile n'a pas de `src/` : ses sources sont `app/` (routing), `feature/` et `shared/`.
#
# Les workflows et les Dockerfile en font partie : la chaîne de livraison est du code exécuté avec
# des droits, et c'est là que Sonar trouve ses vraies vulnérabilités (actions non épinglées,
# secrets étendus dans un `run`, conteneur en root). Les exclure rendait la note de sécurité
# flatteuse plutôt que vraie.
sonar.sources=\
  .github,\
  apps/api/src,\
  apps/api/Dockerfile,\
  apps/web/src,\
  apps/web/Dockerfile,\
  apps/web/nginx.conf,\
  apps/mobile/app,\
  apps/mobile/feature,\
  apps/mobile/shared,\
  deploy,\
  packages/shared/src,\
  packages/tokens/src
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  apps/api/src/generated/**,\
  apps/web/src/routeTree.gen.ts,\
  apps/mobile/.expo/**,\
  docs/**

# `**/*.test.tsx` est entré en #58, aux TROIS endroits ci-dessus et ci-dessous. L'API et
# @cmv/shared n'ont que des `.ts`, si bien que le motif `.tsx` manquait sans conséquence — jusqu'au
# premier test de composant web, qui aurait été analysé comme du code de PRODUCTION et compté en
# lignes non couvertes. Un test qui fait baisser la couverture est le genre de signal qui apprend à
# ne plus en écrire.
sonar.tests=\
  apps/api/src,\
  apps/web/src,\
  apps/mobile/app,\
  apps/mobile/feature,\
  apps/mobile/shared,\
  packages/shared/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx

# Couverture : la CI doit tester AVANT de scanner. Cinq rapports, que Sonar unit par fichier —
# aucune fusion à faire à la main. Le job SonarCloud Analysis n'en produit AUCUN (#318) : il les
# reçoit en artefact des deux jobs qui ont exécuté les tests, et analyse la mesure de CES exécutions.
#   - @cmv/shared         : `pnpm turbo test` (job « Lint + Typecheck + Test ») ;
#   - apps/api unitaires  : idem, ~23 % seuls — ce que le HTTP n'atteint pas : pannes, courses,
#                           configuration ;
#   - apps/api e2e        : produit par le job « E2E (isolation multi-tenant) » et récupéré en
#                           artefact. Il porte l'essentiel de la couverture de l'API (~93 % seul) ;
#                           uni aux unitaires, ne restent que le code mort de #512 (#506) ;
#   - apps/web            : `pnpm turbo test` également, depuis #58 ;
#   - apps/mobile         : idem, depuis #59. Aucune étape de CI à ajouter pour ces deux-là — le
#                           script `test` de chaque paquet produit son lcov à chaque exécution.
sonar.javascript.lcov.reportPaths=\
  packages/shared/coverage/lcov.info,\
  apps/api/coverage/lcov.info,\
  apps/api/coverage-e2e/lcov.info,\
  apps/web/coverage/lcov.info,\
  apps/mobile/coverage/lcov.info

# `apps/api/**` a été retiré de ces exclusions en #57. Le commentaire d'avant affirmait que les e2e
# tournaient dans « un process Nest à part » et ne pouvaient donc pas être instrumentés : c'était
# faux, ils font `app.listen()` dans le process du worker Vitest, que v8 mesure. La conclusion
# décourageait la manœuvre pour une mauvaise raison, d'où ce rappel plutôt qu'une simple coupe.
#
# Restent exclus de la MESURE (le code, lui, reste analysé : bugs, sécurité, smells) :
#   - main.ts / instrument.ts : les e2e passent par `Test.createTestingModule` et ne traversent
#     jamais le bootstrap. Hors d'atteinte du harnais, pas « non testés ».
#
# `apps/web/**` a été retiré en #58 et `apps/mobile/**` en #59 — ENTIÈREMENT dans les deux cas, et
# non ramenés à leur couche util/hook. Restreindre était tentant (côté web, 891 statements
# testables sur 3 047, et une gate qui ne mord que là où l'on a décidé d'écrire des tests), mais
# aurait laissé les écrans et les composants durablement hors de vue — c'est-à-dire reproduit à
# petite échelle le mécanisme qui a créé la dette Q-1 elle-même. Le chiffre affiché baisse en
# conséquence ; il est vrai, et c'est la Quality Gate sur le code NEUF qui garde la suite.
#
# `apps/mobile/app/**` est mesuré comme le reste : 243 lignes, presque toutes des shells d'une
# ligne (règle dure n°4). L'exclure aurait été un réflexe, pas une raison.
#
# Chaque ligne web, mobile et @cmv/shared ci-dessous a sa JUMELLE dans le `coverage.exclude` du
# `vitest.config.ts` du paquet : une exclusion posée d'un seul côté ferait compter le fichier ZÉRO
# au lieu de le retirer du calcul (« Tranché en #57 »). `routeTree.gen.ts` n'y figure pas — il est
# déjà écarté de l'analyse entière par `sonar.exclusions`.
sonar.coverage.exclusions=\
  apps/api/src/main.ts,\
  apps/api/src/instrument.ts,\
  apps/web/src/main.tsx,\
  apps/web/src/app.tsx,\
  apps/web/src/**/index.ts,\
  apps/web/src/**/*.d.ts,\
  apps/mobile/**/index.ts,\
  apps/mobile/**/*.d.ts,\
  packages/shared/src/index.ts,\
  packages/tokens/**

# Un tsconfig par projet analysé : sans celui du web et du mobile, l'analyse de type des .tsx est
# dégradée (alias `@/` non résolus) et remonte du faux positif.
sonar.typescript.tsconfigPaths=\
  apps/api/tsconfig.json,\
  apps/web/tsconfig.json,\
  apps/mobile/tsconfig.json

# `docker:S8431` (« le tag ou le digest, pas les deux ») contredit l'épinglage choisi en #379 : le
# digest rend l'image immuable, le tag dit laquelle c'est et permet à Dependabot de proposer le
# suivant — il réécrit les deux ensemble. Garder le digest seul, ce serait perdre la montée de tag.
# La contrepartie, que la règle signale à raison : Docker ne lit que le digest. Un tag changé à la
# main sans son digest laisse l'image sur l'ancienne version, sans rien signaler — d'où la règle de
# CONTRIBUTING (« Les majeures de node ») : le tag et le digest changent ensemble.
#
# Les trois suivants sont tranchés en #504 (encadré « Tranché en #504 » du journal de dette). Ils
# vivent ici et non dans un « Accepter » de l'interface : une décision prise là est invisible du dépôt.
#
# `typescript:S9382` (« await dans une boucle ») : entrée avec la mise à jour du profil
# « Sonar way comprehensive » du 30/09/2026, 35 occurrences, toutes séquentielles à dessein —
# écritures d'une transaction Prisma, places de parking posées AVANT les places finales sous une
# contrainte d'unicité, chaînes où chaque pas dépend du précédent, pagination, envois
# volontairement un par un, passe hors-ligne qui s'arrête net au changement de compte. Ici le
# séquentiel est la règle et le parallélisme l'exception qui se décide et se justifie ; la règle
# pose l'inverse. Réécrire ces boucles pour la contourner tromperait l'analyse sans rien changer.
#
# `typescript:S6479` (« index en clé ») sur les deux `CmvRichDocument` : un nœud de document riche
# n'a pas d'identifiant, et une clé tirée du contenu entrerait en collision sur deux paragraphes
# identiques. Le rendu est en lecture seule, jamais réordonné ni filtré : l'ordre EST l'identité,
# et l'index la seule clé juste.
#
# `typescript:S9379` (« autoFocus ») dans l'éditeur de consigne : le champ de lien s'ouvre sur un
# clic délibéré, et sans focus il faudrait un second clic pour taper l'URL. Même arbitrage que le
# `biome-ignore` posé sur la ligne.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e3.resourceKey=**/CmvRichDocument.tsx
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S9379
sonar.issue.ignore.multicriteria.e4.resourceKey=apps/web/src/feature/library/component/InstructionsEditor.tsx

sonar.sourceEncoding=UTF-8
