sonar.projectKey=cimavia
sonar.organization=cimavia

# Les trois couches sont analysées. Le web et le mobile y sont entrés une fois qu'ils ont porté de
# la logique (dérivations d'état, composants du design system) et non plus seulement du rendu.
# Mobile n'a pas de `src/` : ses sources sont `app/` (routing), `feature/` et `shared/`.
sonar.sources=\
  apps/api/src,\
  apps/web/src,\
  apps/mobile/app,\
  apps/mobile/feature,\
  apps/mobile/shared,\
  packages/shared/src,\
  packages/tokens/src
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  apps/api/src/generated/**,\
  apps/web/src/routeTree.gen.ts,\
  apps/mobile/.expo/**,\
  docs/**

sonar.tests=apps/api/src,packages/shared/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Couverture : produite par `pnpm turbo test` (v8 → lcov), donc la CI doit tester AVANT de scanner.
sonar.javascript.lcov.reportPaths=packages/shared/coverage/lcov.info

# On ne MESURE la couverture que là où le test unitaire est le bon outil — la logique pure de
# @cmv/shared. Ailleurs, le chiffre mentirait :
#   - apps/api : réellement couverte par les 111 e2e, qui ne sont pas instrumentés (un process Nest
#     à part). Ses 4 tests unitaires afficheraient 3 %, ce qui décrirait l'outil, pas le code.
#   - apps/web, apps/mobile : aucun harnais de test d'UI à ce jour.
# Ces exclusions portent sur la COUVERTURE seule : le code reste analysé (bugs, sécurité, smells).
sonar.coverage.exclusions=\
  apps/api/**,\
  apps/web/**,\
  apps/mobile/**,\
  packages/tokens/**

# Un tsconfig par projet analysé : sans celui du web et du mobile, l'analyse de type des .tsx est
# dégradée (alias `@/` non résolus) et remonte du faux positif.
sonar.typescript.tsconfigPaths=\
  apps/api/tsconfig.json,\
  apps/web/tsconfig.json,\
  apps/mobile/tsconfig.json

sonar.sourceEncoding=UTF-8
